<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星渡 · 星图</title>
<style>
:root{--ink:#edf5ff;--muted:#9cb6d7;--blue:#8fc4ff;--line:rgba(174,211,255,.18);--glass:rgba(9,20,42,.52)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#030711}.top{height:74px;padding:0 max(16px,calc((100vw - 980px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(4,12,27,.72);backdrop-filter:blur(18px);position:relative;z-index:4}.back{width:42px;height:42px;border:1px solid rgba(190,220,255,.16);border-radius:14px;background:rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.11);color:var(--blue);font-size:21px;text-decoration:none;display:grid;place-items:center}.brand{min-width:0}.brand h1{margin:0;font-size:20px;letter-spacing:.06em}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}.nav{margin-left:auto;display:flex;gap:5px}.nav a{padding:7px 9px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap}.nav a.on{background:rgba(132,190,255,.16);color:#d9ecff;box-shadow:inset 0 0 0 1px rgba(157,205,255,.14)}.atlas{position:relative;height:calc(100dvh - 74px);max-width:1120px;margin:auto;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.map-copy{position:absolute;top:30px;left:24px;z-index:2;pointer-events:none;text-shadow:0 1px 18px #000}.eyebrow{display:block;color:#8ebef5;font-size:11px;letter-spacing:.18em;margin-bottom:6px}.map-copy h2{margin:0;font-size:29px;letter-spacing:.06em}.map-copy p{margin:7px 0 0;color:#aac0dc;font-size:13px}.legend{position:absolute;top:29px;right:22px;z-index:2;display:flex;gap:9px;align-items:center;padding:8px 11px;border:1px solid rgba(185,220,255,.2);border-radius:999px;background:var(--glass);box-shadow:0 8px 26px rgba(0,0,0,.22);font-size:11px;color:#bdd1ea;backdrop-filter:blur(12px)}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;box-shadow:0 0 9px currentColor}.legend .star{background:#f6ce8b;color:#f6ce8b}.legend .dust{background:#8ec5ff;color:#8ec5ff}.legend .comet{background:#d9a6d7;color:#d9a6d7}.focus{position:absolute;left:24px;bottom:24px;z-index:3;width:min(382px,calc(100% - 48px));display:none;padding:14px 15px;border:1px solid rgba(191,222,255,.24);border-radius:17px;background:rgba(5,15,34,.76);box-shadow:0 16px 45px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.09);backdrop-filter:blur(15px)}.focus.show{display:block}.focus-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:6px}.focus-kind{color:#91c4ff;font-size:11px;letter-spacing:.12em}.focus-close{border:0;background:transparent;color:var(--muted);font-size:19px;line-height:1;cursor:pointer}.focus-text{font-size:15px;line-height:1.55;color:#edf5ff}.focus-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:#9fb7d5}.focus-meta a{color:#b9dbff;text-decoration:none;white-space:nowrap}.hint{position:absolute;right:24px;bottom:29px;z-index:2;color:rgba(202,222,245,.68);font-size:12px;text-align:right;pointer-events:none;text-shadow:0 1px 12px #000}.hint b{display:block;color:#dbeaff;font-weight:500;margin-bottom:3px}@media(max-width:520px){.top{height:70px;padding:0 14px}.top .back{width:39px;height:39px}.nav{gap:2px}.nav a{padding:6px 6px;font-size:11px}.atlas{height:calc(100dvh - 70px)}.map-copy{top:21px;left:17px}.map-copy h2{font-size:23px}.map-copy p{font-size:12px;max-width:190px}.legend{top:18px;right:13px;padding:6px 8px;gap:6px}.legend span{display:none}.focus{left:13px;bottom:17px;width:calc(100% - 26px)}.hint{right:16px;bottom:22px;font-size:11px}.hint:has(+.focus.show){display:none}}
</style></head>
<body><header class="top"><a class="back" href="/" aria-label="返回">←</a><div class="brand"><h1>星渡</h1><p>共同记忆的坐标</p></div><nav class="nav"><a class="on" href="#">星图</a><a id="starLink" href="#">恒星</a><a id="dustLink" href="#">星尘</a><a id="cometLink" href="#">彗星</a></nav></header><main class="atlas"><canvas id="atlas" aria-label="互动记忆星图"></canvas><div class="map-copy"><span class="eyebrow">SYZYGY · MEMORY ATLAS</span><h2>共同星系</h2><p>每一团光，都守着一段被记住的事。</p></div><div class="legend"><i class="star"></i><span>恒星</span><i class="dust"></i><span>星尘</span><i class="comet"></i><span>彗星</span></div><div class="hint" id="hint"><b>轻触一簇星光</b>进入它守住的记忆</div><section class="focus" id="focus"><div class="focus-top"><span class="focus-kind" id="focusKind">星座</span><button class="focus-close" onclick="closeFocus()" aria-label="关闭">×</button></div><div class="focus-text" id="focusText"></div><div class="focus-meta"><span id="focusTags"></span><a id="focusLink" href="#">打开记忆 →</a></div></section></main>
<script>
const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'',q='?pwd='+encodeURIComponent(PWD);starLink.href='/long-term.html'+q;dustLink.href='/stardust.html'+q;cometLink.href='/comets.html'+q;
const canvas=document.getElementById('atlas'),ctx=canvas.getContext('2d'),focus=document.getElementById('focus');let W=0,H=0,dpr=1,clusters=[],selected=null,view={x:0,y:0,scale:1},drag=null;const hash=s=>{let h=2166136261;for(const c of String(s||'')){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295};const palette=['#ffd58d','#9ed3ff','#d9a8ed','#8fe1cf','#f4a5a8','#aeb3ff','#e7c38c'];const slots=[[.19,.36],[.38,.61],[.55,.33],[.74,.56],[.83,.25],[.62,.78],[.29,.80],[.14,.64]];
function colorFor(t){return palette[Math.floor(hash(t)*palette.length)]}function allTags(d){let rows=[...(d.memories||[]).filter(x=>x.category!=='archived').map(x=>({tags:x.tags||[],text:x.content||''})),...(d.crumbs||[]).filter(x=>x.status!=='archived').map(x=>({tags:[...(x.tags||[]),...(x.entities||[])],text:x.fact||''})),...(d.anticipations||[]).filter(x=>x.status==='open').map(x=>({tags:[...(x.tags||[]),x.entity].filter(Boolean),text:x.content||''}))],map={};rows.forEach(r=>r.tags.filter(t=>String(t).trim()).forEach(t=>{let k=String(t).trim();(map[k]||(map[k]={count:0,samples:[]})).count++;if(r.text&&map[k].samples.length<2)map[k].samples.push(r.text)}));return map}
function makeClusters(data){let tags=allTags(data),ranked=Object.entries(tags).sort((a,b)=>b[1].count-a[1].count).slice(0,8);clusters=ranked.map(([tag,info],i)=>{let [x,y]=slots[i],count=Math.max(4,Math.min(8,3+Math.round(Math.log2(info.count+1))));let members=Array.from({length:count},(_,j)=>{let ang=(j/count)*Math.PI*2+hash(tag+'a')*.8,rad=.028+(j%3)*.021+hash(tag+j)*.014;return{x:x+Math.cos(ang)*rad,y:y+Math.sin(ang)*rad,r:j===0?5.4:1.8+hash(tag+'r'+j)*1.8}});return{tag,info,color:colorFor(tag),x,y,members}});if(!clusters.length)clusters=[{tag:'还未命名',info:{count:0,samples:['从小屋进入后，这片星空会慢慢亮起来。']},color:'#9ed3ff',x:.5,y:.52,members:[{x:.5,y:.52,r:5},{x:.55,y:.49,r:3},{x:.47,y:.57,r:2.5}]}]}
function pxy(p){return{x:(p.x-.5)*W*view.scale+W/2+view.x,y:(p.y-.5)*H*view.scale+H/2+view.y}}function glow(x,y,r,c,a=.7){let g=ctx.createRadialGradient(x,y,0,x,y,r*7);g.addColorStop(0,rgba(c,.92));g.addColorStop(.13,rgba(c,.72));g.addColorStop(.42,rgba(c,.18));g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*7,0,7);ctx.fill();ctx.globalAlpha=1}
function rgba(hex,a){let n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function backdrop(){ctx.fillStyle='#030711';ctx.fillRect(0,0,W,H);let band=ctx.createLinearGradient(0,H*.84,W,H*.1);band.addColorStop(0,'rgba(37,77,137,.02)');band.addColorStop(.32,'rgba(51,103,183,.22)');band.addColorStop(.52,'rgba(132,182,248,.35)');band.addColorStop(.68,'rgba(47,92,166,.21)');band.addColorStop(1,'rgba(8,20,52,.02)');ctx.fillStyle=band;ctx.save();ctx.translate(W*.52,H*.48);ctx.rotate(-.45);for(let i=15;i>0;i--){ctx.globalAlpha=.035+i*.004;ctx.fillStyle=band;ctx.beginPath();ctx.ellipse(0,0,W*.7,H*(.025+i*.012),0,0,7);ctx.fill()}ctx.restore();for(let i=0;i<440;i++){let x=hash('x'+i)*W,y=hash('y'+i)*H,r=hash('r'+i)*1.25+.18,a=.22+hash('a'+i)*.7;ctx.fillStyle=`rgba(220,236,255,${a})`;ctx.fillRect(x,y,r,r);if(i%29===0){ctx.fillStyle='rgba(145,196,255,.17)';ctx.beginPath();ctx.arc(x,y,r*4,0,7);ctx.fill()}}let c=ctx.createRadialGradient(W*.51,H*.48,0,W*.51,H*.48,Math.max(W,H)*.38);c.addColorStop(0,'rgba(172,215,255,.17)');c.addColorStop(.35,'rgba(61,123,218,.09)');c.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}
function draw(){backdrop();clusters.forEach(c=>{let m=c.members.map(pxy),active=selected===c;ctx.strokeStyle=rgba(c.color,active?.72:.31);ctx.lineWidth=active?1.35:.75;ctx.beginPath();m.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(m.length>2)ctx.lineTo(m[0].x,m[0].y);ctx.stroke();m.forEach((p,i)=>{let r=c.members[i].r*(active?1.2:1);glow(p.x,p.y,r,c.color,active?.9:.58);ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill()});if(active){let p=pxy(c);ctx.fillStyle='#eef7ff';ctx.font='500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';ctx.fillText(c.tag,p.x+12,p.y-12)}})}
function showFocus(c){selected=c;hint.style.display='none';focusKind.textContent='星座 · '+c.info.count+' 则记忆';focusText.textContent='「'+c.tag+'」守住了 '+c.info.count+' 段共同记忆。'+(c.info.samples[0]?'  '+String(c.info.samples[0]).replace(/\s+/g,' ').slice(0,54)+'…':'');focusTags.textContent='#'+c.tag;focusLink.href='/long-term.html'+q+'&tag='+encodeURIComponent(c.tag);focus.classList.add('show');draw()}function closeFocus(){selected=null;focus.classList.remove('show');hint.style.display='block';draw()}
function fit(){dpr=Math.min(devicePixelRatio||1,2);let r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,m:false}});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.m=true;view.x+=dx;view.y+=dy;drag.x=e.clientX;drag.y=e.clientY;draw()});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.m){let r=canvas.getBoundingClientRect(),hit,best=Infinity;clusters.forEach(c=>c.members.forEach(n=>{let p=pxy(n),d=Math.hypot(e.clientX-r.left-p.x,e.clientY-r.top-p.y);if(d<38&&d<best){hit=c;best=d}}));if(hit)showFocus(hit)}drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();view.scale=Math.max(.78,Math.min(1.55,view.scale*(e.deltaY>0?.92:1.08)));draw()},{passive:false});
async function load(){try{let r=await fetch('/api/longterm-page-data?pwd='+encodeURIComponent(PWD));if(!r.ok)throw 0;makeClusters(await r.json());fit()}catch(e){makeClusters({});fit();document.querySelector('.map-copy p').textContent='从小屋进入后，这片星空会慢慢亮起来。'}}addEventListener('resize',fit);load();
</script></body></html>
