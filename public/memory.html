<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星渡 · 星图</title>
<style>
:root{--ink:#28364d;--muted:#7890ad;--blue:#5f93cc;--line:rgba(98,132,170,.18);--glass:rgba(238,245,252,.78);--warm:#d89b59;--pink:#b979a5;--aqua:#49a99f}*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.9),transparent 28%),radial-gradient(circle at 76% 72%,rgba(169,203,233,.3),transparent 32%),linear-gradient(150deg,#eff6fc,#e4edf7 55%,#dae7f3)}.top{height:74px;padding:0 max(16px,calc((100vw - 920px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(235,243,251,.76);backdrop-filter:blur(16px);position:relative;z-index:4}.back{width:42px;height:42px;border:0;border-radius:14px;background:rgba(255,255,255,.62);box-shadow:7px 7px 17px rgba(116,143,172,.17),-5px -5px 13px rgba(255,255,255,.7);color:var(--blue);font-size:21px;text-decoration:none;display:grid;place-items:center}.brand{min-width:0}.brand h1{margin:0;font-size:20px;letter-spacing:.06em}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}.nav{margin-left:auto;display:flex;gap:6px}.nav a{padding:7px 9px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12px}.nav a.on{background:rgba(95,147,204,.12);color:var(--blue)}.atlas{position:relative;height:calc(100dvh - 74px);max-width:980px;margin:auto;overflow:hidden}.atlas:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 11% 18%,rgba(95,147,204,.35),transparent),radial-gradient(1px 1px at 75% 28%,rgba(216,155,89,.28),transparent),radial-gradient(1px 1px at 65% 76%,rgba(95,147,204,.23),transparent);background-size:270px 240px,320px 290px,280px 330px;opacity:.8}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.map-copy{position:absolute;top:22px;left:18px;z-index:2;pointer-events:none}.map-copy h2{margin:0;font-size:25px;letter-spacing:.04em}.map-copy p{margin:5px 0 0;color:var(--muted);font-size:13px}.legend{position:absolute;top:23px;right:18px;z-index:2;display:flex;gap:6px;align-items:center;padding:7px 9px;border:1px solid rgba(255,255,255,.55);border-radius:12px;background:var(--glass);box-shadow:4px 5px 11px rgba(116,143,172,.12);font-size:11px;color:var(--muted)}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}.legend .star{background:var(--warm)}.legend .dust{background:var(--blue)}.legend .comet{background:var(--pink)}.map-tools{position:absolute;left:18px;right:18px;bottom:20px;z-index:3;display:flex;gap:8px}.tag-select,.reset{height:38px;border:1px solid rgba(98,132,170,.17);border-radius:12px;background:rgba(244,248,253,.84);color:var(--ink);box-shadow:5px 6px 13px rgba(116,143,172,.14);outline:0}.tag-select{flex:1;min-width:0;padding:0 11px}.reset{width:38px;color:var(--blue);cursor:pointer}.focus{position:absolute;left:18px;right:18px;bottom:68px;z-index:3;display:none;padding:12px 13px;border:1px solid rgba(255,255,255,.72);border-radius:16px;background:rgba(240,247,253,.91);box-shadow:8px 10px 24px rgba(95,124,153,.18);backdrop-filter:blur(12px)}.focus.show{display:block}.focus-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:5px}.focus-kind{color:var(--blue);font-size:11px;letter-spacing:.08em}.focus-close{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.focus-text{font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.focus-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}.focus-meta a{color:var(--blue);text-decoration:none}@media(max-width:520px){.top{height:70px}.nav a{padding:6px 7px;font-size:11px}.atlas{height:calc(100dvh - 70px)}.map-copy{top:18px;left:16px}.map-copy h2{font-size:22px}.map-copy p{font-size:12px;max-width:190px}.legend{top:19px;right:14px;font-size:10px;padding:6px}.legend span{display:none}.map-tools{left:12px;right:12px;bottom:15px}.focus{left:12px;right:12px;bottom:60px}}
</style></head>
<body><header class="top"><a class="back" href="/" aria-label="返回">←</a><div class="brand"><h1>星渡</h1><p>共同记忆的坐标</p></div><nav class="nav"><a class="on" href="#">星图</a><a id="starLink" href="#">恒星</a><a id="dustLink" href="#">星尘</a><a id="cometLink" href="#">彗星</a></nav></header><main class="atlas"><canvas id="atlas" aria-label="互动记忆星图"></canvas><div class="map-copy"><h2>共同星图</h2><p>拖动探索，点亮一件被记住的事。</p></div><div class="legend"><i class="star"></i><span>恒星</span><i class="dust"></i><span>星尘</span><i class="comet"></i><span>彗星</span></div><section class="focus" id="focus"><div class="focus-top"><span class="focus-kind" id="focusKind"></span><button class="focus-close" onclick="closeFocus()" aria-label="关闭">×</button></div><div class="focus-text" id="focusText"></div><div class="focus-meta"><span id="focusTags"></span><a id="focusLink" href="#">打开详情 →</a></div></section><div class="map-tools"><select class="tag-select" id="tagSelect" onchange="selectTag(this.value)"><option value="">全部星座</option></select><button class="reset" onclick="resetMap()" title="回到全图">⌖</button></div></main>
<script>
const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'',q='?pwd='+encodeURIComponent(PWD);starLink.href='/long-term.html'+q;dustLink.href='/stardust.html'+q;cometLink.href='/comets.html'+q;
const canvas=document.getElementById('atlas'),ctx=canvas.getContext('2d');let W=0,H=0,nodes=[],selected=null,chosenTag='',view={x:0,y:0,scale:1},drag=null;const hash=s=>{let h=2166136261;for(const c of String(s||'')){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295};
function colorFor(n){let s=(n.text+' '+n.tags.join(' '));if(/爱|亲|抱|生日|开心|纪念|喜欢/.test(s))return'#d89b59';if(/怕|痛|难过|焦虑|病|哭|累/.test(s))return'#74a8d4';return n.kind==='comet'?'#b979a5':n.kind==='dust'?'#6f9dc8':'#63a79f'}function anchor(t){return{x:.16+hash(t+'x')*.68,y:.19+hash(t+'y')*.59}}
function makeNodes(d){let a=(d.memories||[]).filter(m=>m.category!=='archived').map(m=>({id:m.id,kind:'star',text:m.content||'',tags:m.tags||[],heat:m.liveHeat??m.heat??.55,link:'/long-term.html'+q})),b=(d.crumbs||[]).filter(c=>c.status!=='archived').slice(0,220).map(c=>({id:c.id,kind:'dust',text:c.fact||'',tags:[...(c.entities||[]),...(c.tags||[])],heat:.25,link:'/stardust.html'+q})),c=(d.anticipations||[]).filter(x=>x.status==='open').map(x=>({id:x.id,kind:'comet',text:x.content||'',tags:[x.entity,...(x.tags||[])].filter(Boolean),heat:.7,link:'/comets.html'+q}));nodes=[...a,...b,...c].map(n=>{let t=n.tags[0]||n.kind,p=anchor(t),z=hash(n.id+'a')*Math.PI*2,spread=n.kind==='star'?.11:n.kind==='dust'?.18:.08;return{...n,color:colorFor(n),x:p.x+Math.cos(z)*spread*(.35+hash(n.id+'s')),y:p.y+Math.sin(z)*spread*(.35+hash(n.id+'q')),r:n.kind==='star'?3+n.heat*4:n.kind==='comet'?5:1.2+hash(n.id)*1.6}})}
function fit(){let d=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}function point(n){return{x:(n.x-.5)*W*view.scale+W/2+view.x,y:(n.y-.5)*H*view.scale+H/2+view.y}}
function draw(){ctx.clearRect(0,0,W,H);let v=nodes.filter(n=>!chosenTag||n.tags.includes(chosenTag));if(chosenTag){let a=v.filter(n=>n.tags.includes(chosenTag)).sort((x,y)=>x.x-y.x);ctx.strokeStyle='rgba(95,147,204,.32)';ctx.lineWidth=1;ctx.beginPath();a.forEach((n,i)=>{let p=point(n);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke()}v.filter(n=>n.kind==='comet').forEach(n=>{let p=point(n),g=ctx.createLinearGradient(p.x-34,p.y+18,p.x,p.y);g.addColorStop(0,'rgba(185,121,165,0)');g.addColorStop(1,'rgba(185,121,165,.58)');ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x-34,p.y+18);ctx.lineTo(p.x,p.y);ctx.stroke()});v.forEach(n=>{let p=point(n),r=n.r*Math.max(.72,view.scale*.78);ctx.globalAlpha=n.kind==='dust'?.42:.9;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();if(n.kind!=='dust'){ctx.globalAlpha=.16;ctx.beginPath();ctx.arc(p.x,p.y,r*2.2,0,7);ctx.fill()}if(selected===n){ctx.globalAlpha=.7;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,7);ctx.stroke()}});ctx.globalAlpha=1}
function showFocus(n){selected=n;focusKind.textContent={star:'恒星 · 长期记忆',dust:'星尘 · 生活碎屑',comet:'彗星 · 牵挂线'}[n.kind];focusText.textContent=String(n.text).replace(/\s+/g,' ').trim()||'尚未写下内容';focusTags.textContent=n.tags.slice(0,3).map(t=>'#'+t).join('  ');focusLink.href=n.link;focusLink.textContent=n.kind==='star'?'前往恒星档案 →':n.kind==='dust'?'前往星尘流 →':'前往彗星轨道 →';focus.classList.add('show');draw()}function closeFocus(){selected=null;focus.classList.remove('show');draw()}function resetMap(){view={x:0,y:0,scale:1};closeFocus()}function selectTag(t){chosenTag=t;closeFocus()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,m:false}});canvas.addEventListener('pointermove',e=>{if(!drag)return;let x=e.clientX-drag.x,y=e.clientY-drag.y;if(Math.hypot(x,y)>3)drag.m=true;view.x+=x;view.y+=y;drag.x=e.clientX;drag.y=e.clientY;draw()});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.m){let r=canvas.getBoundingClientRect(),hit,b=1e9;for(let n of nodes){if(chosenTag&&!n.tags.includes(chosenTag))continue;let p=point(n),d=Math.hypot(e.clientX-r.left-p.x,e.clientY-r.top-p.y);if(d<Math.max(18,n.r+8)&&d<b){hit=n;b=d}}if(hit)showFocus(hit)}drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();view.scale=Math.max(.65,Math.min(2.1,view.scale*(e.deltaY>0?.9:1.1)));draw()},{passive:false});
async function load(){try{let r=await fetch('/api/longterm-page-data?pwd='+encodeURIComponent(PWD));if(!r.ok)throw 0;let d=await r.json();makeNodes(d);let count={};nodes.forEach(n=>n.tags.forEach(t=>count[t]=(count[t]||0)+1));let tags=Object.keys(count).filter(t=>count[t]>=2).sort((a,b)=>count[b]-count[a]).slice(0,24);tagSelect.innerHTML='<option value="">全部星座 · '+nodes.length+' 个记忆体</option>'+tags.map(t=>'<option value="'+t.replace(/"/g,'&quot;')+'">'+t+' · '+count[t]+'</option>').join('');fit()}catch(e){document.querySelector('.map-copy p').textContent='星图暂时无法定位，请从小屋重新进入。'}}addEventListener('resize',fit);load();
</script></body></html>
