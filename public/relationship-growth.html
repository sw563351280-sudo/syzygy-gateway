<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>星渡 · 关系成长</title>
  <style>
    :root{--ink:#293a50;--muted:#768ba3;--blue:#6499cc;--line:rgba(95,132,169,.18);--surface:rgba(255,255,255,.55);--rose:#bc7d87;--green:#579b83;--gold:#b99348}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 85% 4%,rgba(255,255,255,.92),transparent 26%),radial-gradient(circle at 10% 74%,rgba(191,216,237,.38),transparent 32%),linear-gradient(150deg,#edf5fc,#e4edf6 55%,#dce8f3)}button{font:inherit;cursor:pointer}.top{min-height:72px;padding:10px max(18px,calc((100vw - 930px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(235,243,251,.76);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.back{width:42px;height:42px;display:grid;place-items:center;text-decoration:none;color:var(--blue);font-size:21px;border-radius:14px;background:rgba(255,255,255,.6)}.top h1{margin:0;font-size:19px}.top p{margin:2px 0 0;color:var(--muted);font-size:11px}.top-actions{margin-left:auto;display:flex;gap:7px}.top-actions button{border:0;border-radius:12px;padding:9px 12px;color:#fff;background:linear-gradient(135deg,#6499cc,#7aafd7)}main{max-width:930px;margin:auto;padding:24px 16px 48px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.intro h2{margin:0 0 7px;font-size:27px}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:15px}.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{border:1px solid var(--line);border-radius:11px;padding:8px 13px;color:var(--muted);background:rgba(255,255,255,.42)}.tabs button.on{border-color:var(--blue);color:#fff;background:var(--blue)}.notice{padding:13px 15px;margin-bottom:13px;border:1px solid rgba(185,147,72,.22);border-radius:15px;color:#7f6a3d;background:rgba(255,247,224,.62);font-size:12px;line-height:1.55}.empty{padding:54px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.3)}.episode{margin-bottom:13px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:9px 12px 26px rgba(96,123,151,.08);overflow:hidden}.episode-head{padding:16px 17px;border-bottom:1px solid var(--line)}.episode-title{display:flex;align-items:center;gap:9px;justify-content:space-between}.episode-title h3{margin:0;font-size:16px}.badge{flex:none;padding:5px 8px;border-radius:99px;font-size:10px}.badge.open{color:#9a7332;background:rgba(215,167,68,.13)}.badge.resolved{color:#477f6b;background:rgba(87,155,131,.13)}.episode-summary{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.themes{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.theme{padding:4px 8px;border-radius:99px;color:#547fa8;background:rgba(100,153,204,.1);font-size:10px}.timeline{padding:14px 18px 17px 35px}.event{position:relative;padding:0 0 17px 16px;border-left:2px solid rgba(100,153,204,.22)}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-sizing:border-box}.event[data-stage="repair"]:before,.event[data-stage="resolution"]:before{border-color:var(--green)}.event[data-stage="escalation"]:before,.event[data-stage="rupture"]:before{border-color:var(--rose)}.event-date{font-size:10px;color:var(--muted)}.event strong{display:block;margin:3px 0 4px;font-size:13px}.event p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.event details{margin-top:7px;font-size:11px;color:var(--muted)}.event details div{padding:8px 10px;margin-top:5px;border-radius:9px;background:rgba(100,153,204,.07);line-height:1.5}.insight{padding:17px;margin-bottom:12px;border:1px solid var(--line);border-radius:19px;background:var(--surface)}.insight-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.insight h3{margin:0;font-size:16px}.confidence{padding:5px 8px;border-radius:99px;font-size:10px}.confidence.tentative{color:#98733c;background:rgba(185,147,72,.13)}.confidence.developing{color:#547fa8;background:rgba(100,153,204,.13)}.confidence.stable{color:#477f6b;background:rgba(87,155,131,.13)}.insight-block{margin-top:12px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.4)}.insight-block b{display:block;margin-bottom:4px;font-size:11px;color:var(--muted)}.insight-block p{margin:0;font-size:13px;line-height:1.6}.next-time{border-left:3px solid var(--blue)}.evidence{margin-top:11px;color:var(--muted);font-size:11px}.toast{display:none;position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 15px;border-radius:11px;background:#293a50;color:#fff;font-size:12px}@media(max-width:600px){.intro{align-items:flex-start;flex-direction:column}.top-actions button{padding:8px 10px}.stats{width:100%}.stat{flex:1}.episode-title,.insight-head{align-items:flex-start}.timeline{padding-left:28px}}
  </style>
</head>
<body>
  <header class="top"><a class="back" id="backLink" href="#" aria-label="返回恒星">←</a><div><h1>关系成长</h1><p>过程、修复，以及沈望真正学到的事</p></div><div class="top-actions"><button id="organizeBtn" onclick="startBackfill()">整理已有记忆</button></div></header>
  <main>
    <section class="intro"><div><h2>不是给谁下定义</h2><p>这里只整理互动过程。原始记忆不会被修改，心得也会随着新证据继续修正。</p></div><div class="stats"><span class="stat"><b id="episodeCount">0</b>段过程</span><span class="stat"><b id="insightCount">0</b>条心得</span><span class="stat"><b id="openCount">0</b>段进行中</span></div></section>
    <div class="tabs"><button id="episodeTab" class="on" onclick="setView('episodes')">相处过程</button><button id="insightTab" onclick="setView('insights')">沈望的心得</button></div>
    <div id="notice" class="notice">心得只有在出现修复、和好或事后复盘后才会生成；一次证据只能形成“暂定”，不会直接变成永久结论。</div>
    <section id="content"><div class="empty">正在读取…</div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'';
    backLink.href='/long-term.html?pwd='+encodeURIComponent(PWD);
    let DATA={episodes:[],insights:[],stats:{},backfill:{}},VIEW='episodes',pollTimer=null;
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stageName=s=>({context:'背景',trigger:'导火索',escalation:'情绪升级',rupture:'僵持',repair:'开始修复',resolution:'达成和解',aftermath:'事后复盘'})[s]||'过程';
    const confidenceName=s=>({tentative:'暂定',developing:'逐渐确认',stable:'较稳定'})[s]||'暂定';
    function say(text){toast.textContent=text;toast.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.display='none',2200)}
    function fmt(value){if(!value)return'时间未标注';let date=new Date(value);return isNaN(date)?esc(value):date.toLocaleString('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
    function setView(view){VIEW=view;episodeTab.classList.toggle('on',view==='episodes');insightTab.classList.toggle('on',view==='insights');render()}
    function renderEpisode(item){let themes=(item.themes||[]).map(x=>'<span class="theme">'+esc(x)+'</span>').join('');let events=(item.events||[]).map(e=>'<div class="event" data-stage="'+esc(e.stage)+'"><span class="event-date">'+fmt(e.occurred_at)+'</span><strong>'+esc(stageName(e.stage))+'</strong><p>'+esc(e.summary)+'</p>'+(e.source_quote?'<details><summary>查看当时的原话</summary><div>'+esc(e.source_quote)+'</div></details>':'')+'</div>').join('');return '<article class="episode"><div class="episode-head"><div class="episode-title"><h3>'+esc(item.title)+'</h3><span class="badge '+esc(item.status)+'">'+(item.status==='resolved'?'已修复':'仍在发展')+'</span></div><p class="episode-summary">'+esc(item.summary||'这段过程还在形成。')+'</p><div class="themes">'+themes+'</div></div><div class="timeline">'+events+'</div></article>'}
    function renderInsight(item){let supports=(item.support_memory_ids||[]).length,counters=(item.counter_memory_ids||[]).length;return '<article class="insight"><div class="insight-head"><h3>'+esc(item.title)+'</h3><span class="confidence '+esc(item.confidence)+'">'+confidenceName(item.confidence)+'</span></div><div class="insight-block"><b>从过程里观察到</b><p>'+esc(item.observation)+'</p></div><div class="insight-block"><b>沈望学到</b><p>'+esc(item.lesson)+'</p></div><div class="insight-block next-time"><b>下次可以怎样做</b><p>'+esc(item.next_time)+'</p></div><div class="evidence">'+supports+' 条支持证据'+(counters?' · '+counters+' 条反例正在修正这条心得':'')+(item.revision_history?.length?' · 已修订 '+item.revision_history.length+' 次':'')+'</div></article>'}
    function render(){episodeCount.textContent=DATA.stats?.episodes||0;insightCount.textContent=DATA.stats?.insights||0;openCount.textContent=DATA.stats?.open||0;let items=VIEW==='episodes'?DATA.episodes:DATA.insights;content.innerHTML=items.length?items.map(VIEW==='episodes'?renderEpisode:renderInsight).join(''):'<div class="empty">'+(VIEW==='episodes'?'还没有形成完整的关系过程。普通情绪和无法归类的记忆会继续留在原来的记忆库里。':'还没有形成心得。只有经历过修复或事后复盘，才会在这里出现。')+'</div>';let running=!!DATA.backfill?.running;organizeBtn.disabled=running;organizeBtn.textContent=running?'整理中 '+(DATA.backfill.scanned||0)+'/'+(DATA.backfill.total||0):'整理已有记忆';if(running&&!pollTimer)pollTimer=setInterval(loadData,2200);if(!running&&pollTimer){clearInterval(pollTimer);pollTimer=null}}
    async function loadData(){let r=await fetch('/api/relationship-reflections?pwd='+encodeURIComponent(PWD));if(!r.ok){content.innerHTML='<div class="empty">读取失败，请检查密码。</div>';return}DATA=await r.json();render()}
    async function startBackfill(){if(!confirm('整理已有的关系记忆？原始记忆不会被修改。'))return;let r=await fetch('/api/relationship-reflections/backfill?pwd='+encodeURIComponent(PWD),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:100})}),d=await r.json().catch(()=>({}));if(!r.ok){say(d.error||'暂时无法整理');return}say('已经开始在后台梳理');DATA.backfill={...(DATA.backfill||{}),running:true,scanned:0,total:d.backfill?.total||0};render();setTimeout(loadData,700)}
    loadData();
  </script>
</body>
</html>
