  <style>
    :root{--ink:#293a50;--muted:#768ba3;--blue:#6499cc;--line:rgba(95,132,169,.18);--surface:rgba(255,255,255,.55);--rose:#bc7d87;--green:#579b83;--gold:#b99348}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 85% 4%,rgba(255,255,255,.92),transparent 26%),radial-gradient(circle at 10% 74%,rgba(191,216,237,.38),transparent 32%),linear-gradient(150deg,#edf5fc,#e4edf6 55%,#dce8f3)}button,input{font:inherit}.top{min-height:72px;padding:10px max(18px,calc((100vw - 930px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(235,243,251,.76);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.back{width:42px;height:42px;display:grid;place-items:center;text-decoration:none;color:var(--blue);font-size:21px;border-radius:14px;background:rgba(255,255,255,.6)}.top h1{margin:0;font-size:19px}.top p{margin:2px 0 0;color:var(--muted);font-size:11px}main{max-width:930px;margin:auto;padding:24px 16px 48px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.intro h2{margin:0 0 7px;font-size:27px}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:15px}.organizer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;margin:14px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.organizer input{width:72px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.7);color:var(--ink)}.organizer button,.tabs button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted);background:rgba(255,255,255,.52)}.organizer .primary{color:#fff;border-color:transparent;background:var(--blue)}.organizer small{color:var(--muted);margin-left:auto}.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.tabs button.on{border-color:var(--blue);color:#fff;background:var(--blue)}.notice{padding:13px 15px;margin-bottom:13px;border:1px solid rgba(185,147,72,.22);border-radius:15px;color:#7f6a3d;background:rgba(255,247,224,.62);font-size:12px;line-height:1.55}.empty{padding:54px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.3)}.episode{margin-bottom:13px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:9px 12px 26px rgba(96,123,151,.08);overflow:hidden}.episode-head{padding:16px 17px;border-bottom:1px solid var(--line)}.episode-title{display:flex;align-items:center;gap:9px;justify-content:space-between}.episode-title h3{margin:0;font-size:16px}.badge{flex:none;padding:5px 8px;border-radius:99px;font-size:10px}.badge.open,.badge.active{color:#9a7332;background:rgba(215,167,68,.13)}.badge.resolved,.badge.completed{color:#477f6b;background:rgba(87,155,131,.13)}.badge.paused{color:#68798b;background:rgba(104,121,139,.12)}.episode-summary{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.themes{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.theme{padding:4px 8px;border-radius:99px;color:#547fa8;background:rgba(100,153,204,.1);font-size:10px}.timeline{padding:14px 18px 17px 35px}.event{position:relative;padding:0 0 17px 16px;border-left:2px solid rgba(100,153,204,.22)}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-sizing:border-box}.event[data-stage="repair"]:before,.event[data-stage="resolution"]:before,.event[data-stage="completion"]:before{border-color:var(--green)}.event[data-stage="escalation"]:before,.event[data-stage="rupture"]:before,.event[data-stage="setback"]:before{border-color:var(--rose)}.event-date{font-size:10px;color:var(--muted)}.event strong{display:block;margin:3px 0 4px;font-size:13px}.event p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.event details{margin-top:7px;font-size:11px;color:var(--muted)}.event details div{padding:8px 10px;margin-top:5px;border-radius:9px;background:rgba(100,153,204,.07);line-height:1.5}.insight{padding:17px;margin-bottom:12px;border:1px solid var(--line);border-radius:19px;background:var(--surface)}.insight-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.insight h3{margin:0;font-size:16px}.confidence{padding:5px 8px;border-radius:99px;font-size:10px}.confidence.tentative{color:#98733c;background:rgba(185,147,72,.13)}.confidence.developing{color:#547fa8;background:rgba(100,153,204,.13)}.confidence.stable{color:#477f6b;background:rgba(87,155,131,.13)}.insight-block{margin-top:12px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.4)}.insight-block b{display:block;margin-bottom:4px;font-size:11px;color:var(--muted)}.insight-block p{margin:0;font-size:13px;line-height:1.6}.next-time{border-left:3px solid var(--blue)}.evidence{margin-top:11px;color:var(--muted);font-size:11px}.toast{display:none;position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 15px;border-radius:11px;background:#293a50;color:#fff;font-size:12px}@media(max-width:600px){.intro{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1}.organizer small{width:100%;margin:0}.episode-title,.insight-head{align-items:flex-start}.timeline{padding-left:28px}}
    .episode>summary{list-style:none;cursor:pointer}.episode>summary::-webkit-details-marker{display:none}.episode-head{position:relative;padding-right:54px}.episode:not([open]) .episode-head{border-bottom:0}.episode-head:after{content:"展开";position:absolute;right:17px;top:17px;color:var(--blue);font-size:11px}.episode[open] .episode-head:after{content:"收起"}.episode>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

<body>
  <header class="top"><a class="back" id="backLink" href="#" aria-label="返回恒星">←</a><div><h1>记忆脉络</h1><p>现实经历、关系过程，以及沈望真正学到的事</p></div></header>
  <main>
    <section class="intro"><div><h2>不是把记忆塞进文件夹</h2><p>这里只整理会发展的过程。原始记忆不会被修改，新记忆写入后会自动接入已有脉络。</p></div><div class="stats"><span class="stat"><b id="realityCount">0</b>现实事件</span><span class="stat"><b id="temperatureState">未判断</b>关系温度</span><span class="stat"><b id="episodeCount">0</b>相处过程</span><span class="stat"><b id="insightCount">0</b>条心得</span></div></section>
    <div class="organizer"><span>最近</span><input id="limitInput" value="20" inputmode="numeric" aria-label="整理条数"><button onclick="setLimit(10)">10</button><button onclick="setLimit(20)">20</button><button onclick="setLimit(30)">30</button><button onclick="setLimit('MAX')">MAX</button><button class="primary" id="realityOrganizeBtn" onclick="startBackfill('reality')">整理现实事件</button><button class="primary" id="relationshipOrganizeBtn" onclick="startBackfill('relationship')">整理关系记忆</button><small id="organizeStatus">新写入的记忆会自动整理</small></div>
    <div class="tabs"><button id="realityTab" class="on" onclick="setView('reality')">现实事件</button><button id="episodeTab" onclick="setView('episodes')">相处过程</button><button id="temperatureTab" onclick="setView('temperature')">温度变化</button><button id="insightTab" onclick="setView('insights')">沈望的心得</button></div>
    <div id="notice" class="notice">心得只有在出现修复、和好或事后复盘后才会生成；一次证据只能形成“暂定”，不会直接变成永久结论。</div>
    <section id="content"><div class="empty">正在读取…</div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'';
    backLink.href='/long-term.html?pwd='+encodeURIComponent(PWD);
    let DATA={reality_events:[],episodes:[],insights:[],temperature_events:[],stats:{},backfill:{},reality_backfill:{}},VIEW='reality',pollTimer=null;
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stageName=(s,t)=>({friction_started:'出现摩擦',conflict_started:'进入冲突',conflict_continues:'冲突延续',paused_unresolved:'暂停未决',tentative_contact:'试探接触',repair_started:'开始修复',resolved:'达成和解',conflict_reopened:'冲突重启'})[t]||({context:'背景',trigger:'导火索',escalation:'情绪升级',rupture:'僵持',repair:'开始修复',resolution:'达成和解',aftermath:'事后复盘'})[s]||'过程';
    const confidenceName=s=>({tentative:'暂定',developing:'逐渐确认',stable:'较稳定'})[s]||'暂定';
    function say(text){toast.textContent=text;toast.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.display='none',2200)}
    function fmt(value){if(!value)return'时间未标注';let date=new Date(value);return isNaN(date)?esc(value):date.toLocaleString('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
    const realityStageName=s=>({beginning:'开始',context:'背景',progress:'进展',setback:'波折',decision:'决定',milestone:'里程碑',completion:'结束'})[s]||'记录';
    const realityStatusName=s=>({active:'进行中',paused:'暂时停下',completed:'已结束'})[s]||'进行中';
    function setLimit(value){limitInput.value=value}
    function readLimit(){let raw=limitInput.value.trim();if(/^max$/i.test(raw))return'max';let value=Number(raw);if(!Number.isFinite(value)||value<1){say('请填写大于 0 的条数，或填写 MAX');return null}value=Math.min(Math.floor(value),500);limitInput.value=value;return value}
    function setView(view){VIEW=view;realityTab.classList.toggle('on',view==='reality');episodeTab.classList.toggle('on',view==='episodes');temperatureTab.classList.toggle('on',view==='temperature');insightTab.classList.toggle('on',view==='insights');render()}
    function renderReality(item){let subjects=(item.subjects||[]).map(x=>'<span class="theme">'+esc(x)+'</span>').join('');let events=(item.milestones||[]).map(e=>'<div class="event" data-stage="'+esc(e.stage)+'"><span class="event-date">'+fmt(e.occurred_at)+'</span><strong>'+esc(realityStageName(e.stage))+'</strong><p>'+esc(e.summary)+'</p>'+(e.source_quote?'<details><summary>查看当时的原话</summary><div>'+esc(e.source_quote)+'</div></details>':'')+'</div>').join('');return '<article class="episode"><div class="episode-head"><div class="episode-title"><h3>'+esc(item.title)+'</h3><span class="badge '+esc(item.status)+'">'+realityStatusName(item.status)+'</span></div><p class="episode-summary">'+esc(item.summary||'这件事的脉络还在形成。')+'</p><div class="themes">'+subjects+'</div></div><div class="timeline">'+events+'</div></article>'}
    function renderEpisode(item){let themes=(item.themes||[]).map(x=>'<span class="theme">'+esc(x)+'</span>').join('');let events=(item.events||[]).map(e=>'<div class="event" data-stage="'+esc(e.stage)+'"><span class="event-date">'+fmt(e.occurred_at)+'</span><strong>'+esc(stageName(e.stage,e.transition))+'</strong><p>'+esc(e.summary)+'</p>'+(e.source_quote?'<details><summary>查看当时的原话</summary><div>'+esc(e.source_quote)+'</div></details>':'')+'</div>').join('');return '<article class="episode"><div class="episode-head"><div class="episode-title"><h3>'+esc(item.title)+'</h3><span class="badge '+esc(item.status)+'">'+(item.status==='resolved'?'已修复':'仍在发展')+'</span></div><p class="episode-summary">'+esc(item.summary||'这段过程还在形成。')+'</p><div class="themes">'+themes+'</div></div><div class="timeline">'+events+'</div></article>'}
    function renderInsight(item){let supports=(item.support_memory_ids||[]).length,counters=(item.counter_memory_ids||[]).length;return '<article class="insight"><div class="insight-head"><h3>'+esc(item.title)+'</h3><span class="confidence '+esc(item.confidence)+'">'+confidenceName(item.confidence)+'</span></div><div class="insight-block"><b>从过程里观察到</b><p>'+esc(item.observation)+'</p></div><div class="insight-block"><b>沈望学到</b><p>'+esc(item.lesson)+'</p></div><div class="insight-block next-time"><b>下次可以怎样做</b><p>'+esc(item.next_time)+'</p></div><div class="evidence">'+supports+' 条支持证据'+(counters?' · '+counters+' 条反例正在修正这条心得':'')+(item.revision_history?.length?' · 已修订 '+item.revision_history.length+' 次':'')+'</div></article>'}
    function renderTemperature(item){let names=temperatureNames;return '<article class="insight temperature-event"><div class="insight-head"><h3>'+(item.from?esc(names[item.from]||item.from)+' → ':'首次判断为 ')+esc(names[item.to]||item.to)+'</h3><span class="confidence developing">'+fmt(item.occurred_at)+'</span></div><div class="insight-block"><b>状态变化依据</b><p>'+esc(item.summary)+'</p></div>'+(item.source_quote?'<div class="insight-block"><b>当时的原话</b><p>'+esc(item.source_quote)+'</p></div>':'')+'</article>'}
    const isNewVisualTheme=()=>typeof document!=='undefined'&&document.documentElement?.dataset?.visualTheme==='new';
    const journeyDateRange=events=>{let first=events[0],last=events.at(-1),start=fmt(first?.occurred_at),end=fmt(last?.occurred_at);return start&&end&&start!==end?start+' — '+end:start||end||'时间未标注'};
    function renderTemperatureJourney(entry){
      if(entry.kind==='event')return renderTemperature(entry.event);
      let events=entry.events||[],states=[];if(events.length){states.push(temperatureNames[events[0].from]||events[0].from);events.forEach(event=>states.push(temperatureNames[event.to]||event.to))}
      let latest=events.at(-1)||{},status=entry.status==='complete'?'回到亲密':'仍在路上',quotes=events.filter(event=>event.source_quote).slice(-2).map(event=>'<details><summary>当时的原话</summary><div>'+esc(event.source_quote)+'</div></details>').join('');
      return '<article class="insight temperature-journey '+esc(entry.status)+'"><div class="insight-head"><span class="journey-range">'+esc(journeyDateRange(events))+'</span><span class="confidence '+(entry.status==='complete'?'stable':'developing')+'">'+status+'</span></div><div class="journey-states">'+states.map(state=>'<span>'+esc(state)+'</span>').join('<i aria-hidden="true">·</i>')+'</div><div class="insight-block"><b>'+ (entry.status==='complete'?'这一段怎样回到这里':'这一段还在经过什么') +'</b><p>'+esc(latest.summary||'这段往返还在慢慢形成。')+'</p></div>'+(quotes?'<div class="journey-quotes">'+quotes+'</div>':'')+'<div class="evidence">包含 '+events.length+' 次状态变化</div></article>';
    }
    const temperatureNames={warm:'亲密',neutral:'正常',withdrawn:'疏离',hostile:'敌意'};
    const displayDate=value=>{let date=new Date(value||'');return Number.isFinite(date.getTime())?date.toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric'}):''};
    const chapterTitle=(item,events)=>{let title=String(item?.title||'').trim();if(title&&title!=='一段现实经历')return title;let dates=(events||[]).map(event=>displayDate(event.occurred_at||event.updated_at||event.created_at)).filter(Boolean);let first=dates.at(-1),last=dates[0];return first&&last&&first!==last?first+' — '+last:first||last||'尚未命名的经历'};
    const chapterAside=(events,fallback)=>{let quoted=(events||[]).filter(event=>event.source_quote).slice(0,2).map(event=>'<div class="timeline-note quote"><b>当时的原话</b><p>'+esc(event.source_quote)+'</p></div>').join('');return quoted||'<div class="timeline-note"><b>这段过程</b><p>'+esc(fallback)+'</p></div>'};
    const temperatureEventTime=item=>{for(const value of [item?.occurred_at,item?.updated_at,item?.created_at]){let time=new Date(value||'').getTime();if(Number.isFinite(time))return time}return null};
    function deriveTemperatureJourneys(items){
      const known=new Set(Object.keys(temperatureNames));
      const ordered=(items||[]).map((event,index)=>({event,index,time:temperatureEventTime(event)})).sort((a,b)=>a.time===null&&b.time===null?a.index-b.index:a.time===null?1:b.time===null?-1:a.time-b.time||a.index-b.index);
      const result=[],fallback=[];let journey=null;
      const addFallback=entry=>fallback.push({kind:'event',event:entry.event,sort:entry.time,index:entry.index});
      for(const entry of ordered){const event=entry.event||{},from=event.from,to=event.to,valid=known.has(from)&&known.has(to);
        if(!valid){if(journey){result.push({kind:'journey',status:'open',events:journey.events,sort:journey.sort,index:journey.index});journey=null}addFallback(entry);continue}
        if(!journey){if(from==='warm'&&to!=='warm')journey={events:[event],sort:entry.time,index:entry.index};else addFallback(entry);continue}
        journey.events.push(event);
        if(to==='warm'){result.push({kind:'journey',status:'complete',events:journey.events,sort:journey.sort,index:journey.index});journey=null}
      }
      if(journey)result.push({kind:'journey',status:'open',events:journey.events,sort:journey.sort,index:journey.index});
      return [...result,...fallback].sort((a,b)=>a.sort===null&&b.sort===null?b.index-a.index:a.sort===null?-1:b.sort===null?1:b.sort-a.sort||b.index-a.index);
    }
    globalThis.deriveTemperatureJourneys=deriveTemperatureJourneys;
    const timeOf=value=>{let time=new Date(value||0).getTime();return Number.isFinite(time)?time:0};
    const newestFirst=(items,getTime=item=>item.updated_at||item.created_at)=>[...(items||[])].sort((a,b)=>timeOf(getTime(b))-timeOf(getTime(a)));
    function renderReality(item,index){let subjects=(item.subjects||[]).map(x=>'<span class="theme">'+esc(x)+'</span>').join('');let orderedEvents=newestFirst(item.milestones,e=>e.occurred_at||e.updated_at||e.created_at),events=orderedEvents.map(e=>'<div class="event" data-stage="'+esc(e.stage)+'"><span class="event-date">'+fmt(e.occurred_at)+'</span><strong>'+esc(realityStageName(e.stage))+'</strong><p>'+esc(e.summary)+'</p>'+(e.source_quote?'<details><summary>查看当时的原话</summary><div>'+esc(e.source_quote)+'</div></details>':'')+'</div>').join('');return '<details class="episode"'+(index===0?' open':'')+'><summary class="episode-head"><div class="episode-title"><h3>'+esc(chapterTitle(item,orderedEvents))+'</h3><span class="badge '+esc(item.status)+'">'+realityStatusName(item.status)+'</span></div><p class="episode-summary">'+esc(item.summary||'这件事的脉络还在形成。')+'</p><div class="themes">'+subjects+'</div></summary><div class="timeline"><div class="timeline-rail">'+events+'</div><aside class="timeline-aside">'+chapterAside(orderedEvents,item.summary||'这件事的脉络还在形成。')+'</aside></div></details>'}
    function renderEpisode(item,index){let themes=(item.themes||[]).map(x=>'<span class="theme">'+esc(x)+'</span>').join('');let orderedEvents=newestFirst(item.events,e=>e.occurred_at||e.updated_at||e.created_at),events=orderedEvents.map(e=>'<div class="event" data-stage="'+esc(e.stage)+'"><span class="event-date">'+fmt(e.occurred_at)+'</span><strong>'+esc(stageName(e.stage,e.transition))+'</strong><p>'+esc(e.summary)+'</p>'+(e.source_quote?'<details><summary>查看当时的原话</summary><div>'+esc(e.source_quote)+'</div></details>':'')+'</div>').join('');return '<details class="episode"'+(index===0?' open':'')+'><summary class="episode-head"><div class="episode-title"><h3>'+esc(chapterTitle(item,orderedEvents))+'</h3><span class="badge '+esc(item.status)+'">'+(item.status==='resolved'?'已修复':'仍在发展')+'</span></div><p class="episode-summary">'+esc(item.summary||'这段过程还在形成。')+'</p><div class="themes">'+themes+'</div></summary><div class="timeline"><div class="timeline-rail">'+events+'</div><aside class="timeline-aside">'+chapterAside(orderedEvents,item.summary||'这段过程还在形成。')+'</aside></div></details>'}
    function render(){temperatureState.textContent=temperatureNames[DATA.temperature_state?.value]||'未判断';realityCount.textContent=DATA.stats?.reality_events||0;episodeCount.textContent=DATA.stats?.episodes||0;insightCount.textContent=DATA.stats?.insights||0;notice.textContent=VIEW==='reality'?'现实事件只收录会发展的现实经历；一次性情绪和关系争吵不会被硬塞进去。不同阶段的工作会分开记录。':'心得只有在出现修复、和好或事后复盘后才会生成；一次证据只能形成“暂定”，不会直接变成永久结论。';let items=VIEW==='reality'?(DATA.reality_events||[]):VIEW==='episodes'?(DATA.episodes||[]):VIEW==='temperature'?(DATA.temperature_events||[]):(DATA.insights||[]);let renderer=VIEW==='reality'?renderReality:VIEW==='episodes'?renderEpisode:VIEW==='temperature'?(isNewVisualTheme()?renderTemperatureJourney:renderTemperature):renderInsight;if(VIEW==='temperature'&&isNewVisualTheme())items=deriveTemperatureJourneys(items);let emptyText=VIEW==='reality'?'还没有形成现实事件脉络。点击上方整理历史记忆；之后的新记忆会自动接入。':VIEW==='episodes'?'还没有形成完整的关系过程。普通情绪和无法归类的记忆会继续留在原来的记忆库里。':VIEW==='temperature'?'还没有发生需要记录的关系温度变化。':'还没有形成心得。只有经历过修复或事后复盘，才会在这里出现。';content.innerHTML=items.length?items.map(renderer).join(''):'<div class="empty">'+emptyText+'</div>';let relationshipRunning=!!DATA.backfill?.running,realityRunning=!!DATA.reality_backfill?.running;relationshipOrganizeBtn.disabled=relationshipRunning;realityOrganizeBtn.disabled=realityRunning;relationshipOrganizeBtn.textContent=relationshipRunning?'关系整理中 '+(DATA.backfill.scanned||0)+'/'+(DATA.backfill.total||0):'整理关系记忆';realityOrganizeBtn.textContent=realityRunning?'事件整理中 '+(DATA.reality_backfill.scanned||0)+'/'+(DATA.reality_backfill.total||0):'整理现实事件';let active=realityRunning?DATA.reality_backfill:relationshipRunning?DATA.backfill:null;organizeStatus.textContent=active?'已判断 '+(active.scanned||0)+' / '+(active.total||0)+(active.available>active.total?'，尚有 '+(active.available-active.total)+' 条未整理':''):'新写入的记忆会自动整理';let running=relationshipRunning||realityRunning;if(running&&!pollTimer)pollTimer=setInterval(loadData,2200);if(!running&&pollTimer){clearInterval(pollTimer);pollTimer=null}}
    async function loadData(){try{let r=await fetch('/api/relationship-reflections?pwd='+encodeURIComponent(PWD));if(!r.ok)throw Error('read failed');DATA=await r.json();DATA.reality_events=newestFirst(DATA.reality_events);DATA.episodes=newestFirst(DATA.episodes);render()}catch(_){content.innerHTML='<div class="empty">暂时没读到这些经历。<button type="button" class="growth-retry" onclick="loadData()">重试</button></div>'}}
    async function startBackfill(kind){let limit=readLimit();if(limit===null)return;let label=kind==='reality'?'现实事件':'关系记忆',scope=limit==='max'?'全部尚未整理的记忆':'最近 '+limit+' 条候选记忆';if(!confirm('整理'+scope+'中的'+label+'？原始记忆不会被修改。'))return;let endpoint=kind==='reality'?'/api/reality-events/backfill':'/api/relationship-reflections/backfill';let r=await fetch(endpoint+'?pwd='+encodeURIComponent(PWD),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit})}),d=await r.json().catch(()=>({}));if(!r.ok){say(d.error||'暂时无法整理');return}say('已经开始在后台梳理');let key=kind==='reality'?'reality_backfill':'backfill';DATA[key]={...(DATA[key]||{}),running:true,scanned:0,total:d.backfill?.total||0,available:d.backfill?.available||0};render();setTimeout(loadData,700)}
    loadData();
  </script>
