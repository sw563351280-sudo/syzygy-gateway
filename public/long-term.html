  <style>
    :root{--ink:#2a3850;--muted:#7890ad;--blue:#5f93cc;--aqua:#4ecbbd;--gold:#d7a744;--line:rgba(98,132,170,.18);--card:rgba(255,255,255,.48)}
    *{box-sizing:border-box} body{margin:0;min-height:100dvh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 82% 8%,rgba(255,255,255,.88),transparent 27%),radial-gradient(circle at 12% 68%,rgba(183,214,239,.35),transparent 32%),linear-gradient(150deg,#edf5fc,#e2ebf5 55%,#dce8f3)}
    .top{height:72px;padding:0 max(18px,calc((100vw - 850px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(235,243,251,.7);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.back{width:42px;height:42px;display:grid;place-items:center;text-decoration:none;color:var(--blue);font-size:21px;border-radius:14px;background:rgba(255,255,255,.58);box-shadow:8px 8px 18px rgba(116,143,172,.16),-5px -5px 14px rgba(255,255,255,.64)}.top h1{margin:0;font-size:20px}.top p{margin:2px 0 0;font-size:12px;color:var(--muted)}.layer-nav{margin-left:auto;display:flex;gap:5px}.layer-nav a{color:var(--muted);font-size:12px;text-decoration:none;padding:7px 8px;border-radius:9px}.layer-nav a.on{color:var(--blue);background:rgba(95,147,204,.11)}
    main{max-width:850px;margin:auto;padding:24px 16px 44px}.hero{padding:7px 3px 18px}.hero h2{font-size:28px;margin:0 0 6px;letter-spacing:.03em}.hero p{margin:0;color:var(--muted);font-size:14px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px}.search{height:46px;border:1px solid var(--line);border-radius:15px;padding:0 15px;background:rgba(255,255,255,.52);font:inherit;color:var(--ink);outline:0}.search:focus{border-color:rgba(95,147,204,.52)}button{font:inherit;cursor:pointer}.add{border:0;border-radius:14px;padding:0 16px;color:white;background:linear-gradient(135deg,#5f93cc,#77aed9);box-shadow:0 7px 16px rgba(95,147,204,.2)}
    .filters{display:flex;gap:8px;overflow:auto;padding:3px 0 15px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.46);color:var(--ink);padding:5px 6px 5px 7px;white-space:nowrap;font-size:12px;box-shadow:0 4px 10px rgba(104,127,153,.05)}.pill-icon{width:22px;height:22px;display:grid;place-items:center;border-radius:8px;font-size:13px;font-weight:700}.pill b{min-width:22px;padding:2px 6px;border-radius:99px;text-align:center;background:rgba(98,132,170,.1);font-size:11px}.pill-all .pill-icon,.pill-all b{color:#4c7faf;background:rgba(95,147,204,.13)}.pill-manual .pill-icon,.pill-manual b{color:#b78638;background:rgba(215,167,68,.15)}.pill-shen .pill-icon,.pill-shen b{color:#359e97;background:rgba(78,203,189,.15)}.pill-summary .pill-icon,.pill-summary b{color:#9271bd;background:rgba(160,123,205,.14)}.pill-roleplay .pill-icon,.pill-roleplay b{color:#a06da3;background:rgba(193,139,176,.15)}.pill-archive .pill-icon,.pill-archive b{color:#6189b5;background:rgba(156,193,225,.2)}.pill.active{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 7px 15px rgba(95,147,204,.2)}.pill.active .pill-icon,.pill.active b{color:white;background:rgba(255,255,255,.18)}
    .subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 11px;color:var(--muted);font-size:12px}.sort{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.sort button,.tiny{border:0;background:rgba(255,255,255,.5);color:var(--muted);padding:7px 9px;border-radius:9px;font-size:12px}.sort button:focus-visible,.btn-sm:focus-visible,.batch-bar button:focus-visible{outline:2px solid rgba(95,147,204,.6);outline-offset:2px}.sort .select-toggle.active{background:rgba(95,147,204,.14);color:#4c7faf}.memory-card{position:relative;padding:16px;margin-bottom:11px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:9px 11px 23px rgba(104,127,153,.09);transition:transform .18s ease,box-shadow .18s ease}.memory-card:hover{transform:translateY(-1px);box-shadow:11px 13px 26px rgba(104,127,153,.12)}.memory-card.selecting{padding-left:51px}.mem-check{position:absolute;top:16px;left:16px;display:grid;place-items:center;width:23px;height:23px;border-radius:8px;background:rgba(255,255,255,.48);box-shadow:inset 0 0 0 1px rgba(95,147,204,.16)}.mem-check input{width:17px;height:17px;margin:0;accent-color:var(--blue);cursor:pointer}.cat-roleplay{border-left:3px solid rgba(193,139,176,.72)}.cat-archived{opacity:.68;border-left:3px solid rgba(95,147,204,.6)}.memory-content{font-size:16px;line-height:1.72;white-space:pre-wrap}.memory-tags{padding-top:11px;margin-top:11px;border-top:1px solid rgba(98,132,170,.13);display:flex;flex-wrap:wrap;gap:5px}.tag{background:rgba(95,147,204,.1);color:#4f83b7;padding:4px 9px;border-radius:99px;font-size:11px}.memory-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;color:var(--muted);font-size:11px}.mem-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.btn-sm{border:0;background:rgba(255,255,255,.48);color:var(--muted);border-radius:8px;padding:6px 8px;font-size:12px}.btn-del{color:#bd7183}.batch-bar{position:fixed;z-index:18;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 24px));display:flex;align-items:center;gap:8px;padding:10px 11px 10px 15px;border:1px solid rgba(255,255,255,.66);border-radius:18px;background:rgba(237,245,252,.92);box-shadow:0 13px 34px rgba(75,99,127,.25);backdrop-filter:blur(18px) saturate(112%);transform:translate(-50%,calc(100% + 42px));opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease}.batch-bar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.batch-count{margin-right:auto;color:#5d7187;font-size:13px}.batch-count b{color:#3f6f9e}.batch-bar button{border:0;border-radius:11px;padding:9px 11px;background:rgba(255,255,255,.55);color:#667d94;font-size:12px}.batch-bar .batch-delete{background:#bd7183;color:#fff}.batch-bar .batch-delete:disabled{opacity:.42;cursor:default}.multi-selecting main{padding-bottom:118px}.modal-bg{display:none;position:fixed;inset:0;background:rgba(42,56,80,.28);z-index:20;align-items:center;justify-content:center}.modal-bg.show{display:flex}.modal{width:min(460px,90vw);padding:20px;border-radius:20px;background:#edf5fc;box-shadow:0 20px 60px rgba(42,56,80,.25)}.modal h3{margin:0 0 12px}.modal textarea,.modal input{width:100%;font:inherit;color:var(--ink);border:1px solid var(--line);background:white;border-radius:12px;padding:10px;margin-bottom:9px}.btn-save{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:9px 13px}.toast{position:fixed;z-index:30;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 17px;border-radius:12px;background:#2a3850;color:#fff;display:none;font-size:13px;white-space:nowrap}
    .inbox-banner{display:none;width:100%;margin:0 0 14px;padding:12px 14px;border:1px solid rgba(215,167,68,.25);border-radius:15px;background:rgba(255,248,226,.62);color:#7b683d;text-align:left}.inbox-banner.show{display:flex;align-items:center;justify-content:space-between;gap:12px}.inbox-banner small{display:block;margin-top:3px;color:#9b8551}.inbox-modal{width:min(660px,94vw);max-height:82vh;overflow:auto}.inbox-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.event-card{padding:13px;margin-top:10px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.52)}.event-status{font-size:11px;color:#9b7531}.event-content{margin:7px 0;line-height:1.55}.event-error{font-size:12px;color:#aa6677}.event-candidate{margin-top:8px;padding:9px;border-radius:11px;background:rgba(95,147,204,.08);font-size:12px}.event-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.event-actions button{border:0;border-radius:9px;padding:7px 9px;background:rgba(95,147,204,.12);color:#4c7faf;font-size:12px}.event-actions .muted-action{color:#8b7280;background:rgba(189,113,131,.09)}
    @media(max-width:480px){main{padding:20px 13px 38px}.hero h2{font-size:25px}.memory-content{font-size:15px}.toolbar{grid-template-columns:1fr}.add{height:42px}.subbar{align-items:flex-start;flex-direction:column}.sort{width:100%;justify-content:flex-start}.memory-card.selecting{padding-left:45px}.mem-check{left:13px}.memory-meta{align-items:flex-start;flex-direction:column}.mem-actions{justify-content:flex-start}.batch-bar{padding:9px 10px;gap:6px;flex-wrap:wrap}.batch-count{width:100%;margin-right:0}.batch-bar button{flex:1;padding:9px 6px;white-space:nowrap}.multi-selecting main{padding-bottom:150px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<body>
  <header class="top"><a class="back" id="backLink" href="/" aria-label="返回">←</a><div><h1>恒星</h1><p>已经刻下来的事</p></div><nav class="layer-nav"><a class="on" href="#">恒星</a><a id="growthLink" href="#">成长</a><a id="dustLink" href="#">星尘</a><a id="cometLink" href="#">彗星</a></nav></header>
  <main>
    <div class="hero"><h2>共同记忆</h2><p>不按时间淘汰。它们留在这里，等被自然想起。</p></div>
    <button class="inbox-banner" id="inboxBanner" onclick="openInbox()"><span><b id="inboxTitle">记忆正在整理</b><small id="inboxSubtitle">已经收到，不会丢失</small></span><span>查看 →</span></button>
    <div class="toolbar"><input class="search" id="searchInput" placeholder="找一件已经记下的事…" oninput="filterAll()"><button class="add" onclick="openModal()">＋ 写入</button></div>
    <div class="filters">
      <button class="pill pill-all active" onclick="setFilter(this,'active','all')"><span class="pill-icon">✦</span><span>长期记忆</span><b id="cntAll">0</b></button>
      <button class="pill pill-roleplay" onclick="setFilter(this,'roleplay','all')"><span class="pill-icon">◈</span><span>游戏卡带</span><b id="cntRP">0</b></button>
      <button class="pill pill-archive" onclick="setFilter(this,'archived','all')"><span class="pill-icon">❄</span><span>冰封</span><b id="cntArchived">0</b></button>
      <button class="pill pill-everywhere" onclick="setFilter(this,'all','all')"><span class="pill-icon">⌕</span><span>全部范围</span><b id="cntEverywhere">0</b></button>
    </div>
    <div class="library-filters" aria-label="记忆筛选">
      <label>写入来源<select id="sourceFilter" onchange="changeLibraryFilters()"><option value="all">所有来源</option></select></label>
      <label>排列<select id="orderFilter" onchange="changeLibraryFilters()"><option value="created">最近记下</option><option value="updated">最近修改</option><option value="oldest">最早记下</option></select></label>
    </div>
    <div class="library-summary"><span id="resultSummary" role="status" aria-live="polite"></span><a id="vaultLink" href="#">收纳室 · 合并建议</a><button class="tiny" onclick="clearLibraryFilters()">重置筛选</button></div>
    <div class="subbar"><span>共 <b id="totalCount">0</b> 条</span><span class="sort"><button onclick="openInbox()">待处理</button><button onclick="triggerCleanup()">AI 整理建议</button><button class="select-toggle" id="multiToggle" onclick="toggleMultiSelect()">批量整理</button></span></div>
    <div id="memoryList">加载中…</div>
  </main>
  <div class="batch-bar" id="batchBar" aria-live="polite"><span class="batch-count">已选 <b id="selectedCount">0</b> 条</span><button onclick="selectVisibleMemories()">全选已显示</button><button onclick="toggleMultiSelect(false)">取消</button><button class="batch-delete" id="batchDelete" onclick="deleteSelectedMemories()" disabled>删除</button></div>
  <div class="modal-bg" id="addModal"><div class="modal"><h3>写下一件事</h3><textarea id="newContent" rows="4" placeholder="已经形成的结论…"></textarea><input id="newTags" placeholder="标签，用逗号隔开"><button class="btn-save" onclick="submitNew()">保存</button> <button class="tiny" onclick="closeModal()">取消</button></div></div><div class="toast" id="toast"></div>
  <div class="modal-bg" id="inboxModal"><div class="modal inbox-modal"><div class="inbox-head"><div><h3 style="margin:0">记忆收件箱</h3><div style="font-size:12px;color:var(--muted);margin-top:4px">只显示正在整理或需要确认的内容</div></div><button class="tiny" onclick="closeInbox()">关闭</button></div><div id="inboxList"></div></div></div>
  <script>
    const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'';
    document.getElementById('backLink').href='/?pwd='+encodeURIComponent(PWD);
    document.getElementById('growthLink').href='/relationship-growth.html?pwd='+encodeURIComponent(PWD);
    document.getElementById('dustLink').href='/stardust.html?pwd='+encodeURIComponent(PWD);
    document.getElementById('cometLink').href='/comets.html?pwd='+encodeURIComponent(PWD);
    document.getElementById('vaultLink').href='/memory-vault.html?pwd='+encodeURIComponent(PWD);
    let ALL_MEMS=[],MEMORY_EVENTS=[],COUNTS={},currentCat='active',currentSource='all',multiSelectMode=false,batchDeleting=false;
    const selectedMemoryIds=new Set();
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shenRecord=s=>String(s||'').trim().replace(/^我记着[：:]\s*/,'').replace(/江鱼/g,'她').replace(/你/g,'她').replace(/沈望/g,'我');const stripMemoryLead=s=>String(s||'').trim().replace(/^我记着[：:]\s*/,'');
    function showToast(message){toast.textContent=message;toast.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.style.display='none',2200)}
    function openModal(){addModal.classList.add('show')} function closeModal(){addModal.classList.remove('show')}
    async function submitNew(){let content=newContent.value,tags=newTags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),r=await fetch('/api/long-term-memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,tags})});if((await r.json()).success)location.reload()}
    async function loadData(){let r=await fetch('/api/longterm-page-data?pwd='+encodeURIComponent(PWD));if(!r.ok){memoryList.textContent='加载失败';return}let d=await r.json();ALL_MEMS=d.memories||[];MEMORY_EVENTS=d.memoryEvents||[];COUNTS=d.counts||{};syncCountUI();renderMemoryList();renderInbox()}
    function eventStatusLabel(e){return({received:'已收到',processing:'正在整理',pending:'等待重试',needs_review:'需要确认'})[e.status]||e.status}
    function renderInbox(){let attention=MEMORY_EVENTS.filter(e=>e.status==='needs_review').length,pending=MEMORY_EVENTS.length-attention;inboxBanner.classList.toggle('show',MEMORY_EVENTS.length>0);inboxTitle.textContent=attention?attention+' 条记忆需要确认':pending+' 条记忆正在整理';inboxSubtitle.textContent=attention?'原始内容已保存，由你决定是否合并':'已经收到，模型恢复后会自动继续';inboxList.innerHTML=MEMORY_EVENTS.map(renderEvent).join('')||'<div style="padding:35px 5px;text-align:center;color:var(--muted)">没有等待处理的记忆。</div>'}
    function renderEvent(e){let candidates=(e.candidates||[]).map(c=>'<div class="event-candidate"><b>可能相关：</b>'+esc(shenRecord(c.content))+(e.status==='needs_review'?'<div class="event-actions"><button onclick="resolveEvent(\''+e.id+'\',\'same\',\''+c.id+'\')">视为同一条</button><button onclick="resolveEvent(\''+e.id+'\',\'merge\',\''+c.id+'\')">更新这条</button></div>':'')+'</div>').join(''),actions=e.status==='needs_review'?'<div class="event-actions"><button onclick="resolveEvent(\''+e.id+'\',\'create\')">单独保留</button><button class="muted-action" onclick="resolveEvent(\''+e.id+'\',\'ignore\')">忽略</button><button onclick="retryEvent(\''+e.id+'\')">重新审查</button></div>':e.status==='pending'?'<div class="event-actions"><button onclick="retryEvent(\''+e.id+'\')">立即重试</button></div>':'',attempts=e.attempts?' · 已尝试'+e.attempts+'次':'',next=e.status==='pending'&&e.next_retry_at?' · 下次自动重试 '+new Date(e.next_retry_at).toLocaleString('zh-CN'):'';return '<article class="event-card"><div class="event-status">'+esc(eventStatusLabel(e))+' · '+(e.kind==='crumb'?'生活碎屑':'长期记忆')+attempts+next+' · '+new Date(e.updated_at).toLocaleString('zh-CN')+'</div><div class="event-content">'+esc(shenRecord(e.content))+'</div>'+(e.error?'<div class="event-error">'+esc(e.error)+'</div>':'')+candidates+actions+'</article>'}
    function openInbox(){renderInbox();inboxModal.classList.add('show')}function closeInbox(){inboxModal.classList.remove('show')}
    async function retryEvent(id){let r=await fetch('/api/memory-events/'+encodeURIComponent(id)+'/retry',{method:'POST'}),d=await r.json().catch(()=>({}));showToast(r.ok?'已安排重试':(d.error||'重试失败'));setTimeout(loadData,600)}
    async function resolveEvent(id,action,targetId){let r=await fetch('/api/memory-events/'+encodeURIComponent(id)+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,target_id:targetId||null})}),d=await r.json().catch(()=>({}));if(!r.ok){showToast(d.error||'处理失败');return}showToast('已处理');await loadData();if(!MEMORY_EVENTS.length)closeInbox()}
    function syncCountUI(){cntAll.textContent=ALL_MEMS.filter(m=>m.category==='active').length;cntRP.textContent=ALL_MEMS.filter(m=>m.category==='roleplay').length;cntArchived.textContent=ALL_MEMS.filter(m=>m.category==='archived').length;cntEverywhere.textContent=ALL_MEMS.length;totalCount.textContent=ALL_MEMS.length;refreshLibrarySources()}
    function sourceLabel(s){return({manual:'手动写下',ai_active:'沈望记下',butler_summary:'整理而来',roleplay:'游戏卡带',migrated_from_blocks:'早期导入'})[s]||s||'未注明来源'}
    function scopeMemories(){return ALL_MEMS.filter(m=>currentCat==='all'||m.category===currentCat)}
    function refreshLibrarySources(){
      const sources=new Map(),old=sourceFilter.value;
      for(const m of scopeMemories()){const key=m.source||'';sources.set(key,(sources.get(key)||0)+1)}
      sourceFilter.replaceChildren(new Option('所有来源','all'));
      for(const [source,count] of [...sources].sort((a,b)=>sourceLabel(a[0]).localeCompare(sourceLabel(b[0]),'zh-CN')))sourceFilter.add(new Option(sourceLabel(source)+' · '+count,'source:'+source));
      if([...sourceFilter.options].some(o=>o.value===old))sourceFilter.value=old;
      currentSource=sourceFilter.value==='all'?'all':sourceFilter.value.slice(7);
    }
    function libraryMatches(){
      const query=searchInput.value.trim().toLocaleLowerCase(),order=orderFilter.value;
      const time=m=>Date.parse(order==='updated'?(m.updated_at||m.created_at):m.created_at)||0;
      return scopeMemories().filter(m=>(currentSource==='all'||(m.source||'')===currentSource)&&[m.content,m.source_quote,...(Array.isArray(m.tags)?m.tags:[])].filter(Boolean).join(' ').toLocaleLowerCase().includes(query)).sort((a,b)=>(order==='oldest'?time(a)-time(b):time(b)-time(a))||String(a.id).localeCompare(String(b.id)));
    }
    function updateResultSummary(count,shown=count){resultSummary.textContent=({active:'长期记忆',roleplay:'游戏卡带',archived:'冰封',all:'全部范围'})[currentCat]+' · 找到 '+count+' 条'+(shown<count?'，已显示 '+shown+' 条':'')}
    function changeLibraryFilters(){currentSource=sourceFilter.value==='all'?'all':sourceFilter.value.slice(7);selectedMemoryIds.clear();filterAll()}
    function clearLibraryFilters(){searchInput.value='';sourceFilter.value='all';orderFilter.value='created';setFilter(document.querySelector('.pill-all'),'active','all')}
    function renderCard(m){let heat=m.liveHeat??m.heat??.5,archive=m.category==='archived'?' · 冰封中':'',origin=m.source_quote?'<details class="memory-origin"><summary>原话 · '+esc(new Date(m.source_at||m.created_at).toLocaleString('zh-CN'))+'</summary><div>'+esc(m.source_quote)+'</div></details>':'',shown=m.category==='roleplay'?stripMemoryLead(m.content):shenRecord(m.content),tags=(m.tags||[]).filter(Boolean),tagBlock=tags.length?'<div class="memory-tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'',checked=selectedMemoryIds.has(m.id)?' checked':'',selector=multiSelectMode?'<label class="mem-check" onclick="event.stopPropagation()"><input type="checkbox" aria-label="选择这条记忆"'+checked+' onchange="toggleMemorySelected(\''+m.id+'\',this.checked)"></label>':'',acts=m.category==='archived'?'<button class="btn-sm" onclick="restoreMemory(\''+m.id+'\')">解封</button><button class="btn-sm btn-del" onclick="deleteArchivedMemory(\''+m.id+'\')">删除</button>':'<button class="btn-sm" onclick="startEdit(\''+m.id+'\')">编辑</button><button class="btn-sm" onclick="toggleResolved(\''+m.id+'\','+!!m.resolved+')">'+(m.resolved?'已解决':'标记解决')+'</button><button class="btn-sm btn-del" onclick="deleteMemory(\''+m.id+'\')">删除</button>';return '<article class="memory-card cat-'+m.category+(multiSelectMode?' selecting':'')+'" id="card-'+m.id+'" data-memory-id="'+esc(m.id)+'" data-category="'+m.category+'" data-source="'+m.source+'" data-heat="'+heat+'">'+selector+'<div class="memory-content" id="content-'+m.id+'">'+esc(shown)+'</div>'+origin+tagBlock+'<div class="memory-meta"><span>'+new Date(m.created_at).toLocaleString('zh-CN')+' · '+sourceLabel(m.source)+archive+'</span><span class="mem-actions">'+acts+'</span></div><div id="edit-'+m.id+'" style="display:none;margin-top:10px"><textarea id="ta-'+m.id+'" rows="3">'+esc(stripMemoryLead(m.content))+'</textarea><input id="tags-'+m.id+'" value="'+esc(tags.join(', '))+'"><button class="btn-save" onclick="saveEdit(\''+m.id+'\')">保存</button> <button class="tiny" onclick="cancelEdit(\''+m.id+'\')">取消</button></div></article>'}
    function renderMemoryList(){const matches=libraryMatches();memoryList.innerHTML=matches.map(renderCard).join('')||'<div class="notes-empty">当前筛选下没有记忆，可以重置筛选或切换到全部范围。</div>';updateResultSummary(matches.length);updateBatchUI()}
    function filterAll(){selectedMemoryIds.clear();renderMemoryList()}
    function setFilter(btn,cat,source){document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===btn));currentCat=cat;currentSource=source;sourceFilter.value=source==='all'?'all':'source:'+source;selectedMemoryIds.clear();refreshLibrarySources();filterAll()}
    function startEdit(id){document.getElementById('content-'+id).style.display='none';document.getElementById('edit-'+id).style.display='block'} function cancelEdit(id){document.getElementById('content-'+id).style.display='block';document.getElementById('edit-'+id).style.display='none'}
    async function saveEdit(id){let content=document.getElementById('ta-'+id).value,tags=document.getElementById('tags-'+id).value.split(/[,，]/).filter(Boolean);let r=await fetch('/api/long-term-memories/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,tags})});if((await r.json()).success)location.reload()}
    function captureScrollAnchor(excludedIds){let excluded=new Set(excludedIds),top=document.querySelector('.top').getBoundingClientRect().bottom+4,cards=[...document.querySelectorAll('#memoryList .memory-card')].filter(c=>c.style.display!=='none'&&!excluded.has(c.dataset.memoryId)),anchor=cards.find(c=>c.getBoundingClientRect().bottom>top);return anchor?{id:anchor.dataset.memoryId,top:anchor.getBoundingClientRect().top}:null}
    function applyDeletedMemories(ids){let idSet=new Set(ids),anchor=captureScrollAnchor(ids);ALL_MEMS=ALL_MEMS.filter(m=>!idSet.has(m.id));ids.forEach(id=>{selectedMemoryIds.delete(id);document.getElementById('card-'+id)?.remove()});syncCountUI();renderMemoryList();if(anchor)requestAnimationFrame(()=>{let el=document.getElementById('card-'+anchor.id);if(el)window.scrollBy(0,el.getBoundingClientRect().top-anchor.top)})}
    async function requestMemoryDelete(memory){let url=memory.category==='archived'?'/api/archive-memories/':'/api/long-term-memories/',r=await fetch(url+encodeURIComponent(memory.id),{method:'DELETE'}),d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.error||'删除失败');return memory.id}
    async function deleteMemory(id){if(!confirm('删除这条记忆？'))return;let memory=ALL_MEMS.find(m=>m.id===id);if(!memory)return;try{await requestMemoryDelete(memory);applyDeletedMemories([id]);showToast('已删除')}catch(e){showToast(e.message||'删除失败')}} async function restoreMemory(id){await fetch('/api/archive-memories/'+encodeURIComponent(id)+'/restore',{method:'POST'});location.reload()} async function deleteArchivedMemory(id){if(!confirm('彻底删除这条冰封记忆？'))return;let memory=ALL_MEMS.find(m=>m.id===id);if(!memory)return;try{await requestMemoryDelete(memory);applyDeletedMemories([id]);showToast('已删除')}catch(e){showToast(e.message||'删除失败')}}
    function toggleMultiSelect(force){multiSelectMode=typeof force==='boolean'?force:!multiSelectMode;selectedMemoryIds.clear();document.body.classList.toggle('multi-selecting',multiSelectMode);renderMemoryList()}
    function toggleMemorySelected(id,checked){if(checked)selectedMemoryIds.add(id);else selectedMemoryIds.delete(id);updateBatchUI()}
    function selectVisibleMemories(){let visible=[...document.querySelectorAll('#memoryList .memory-card')].filter(c=>c.style.display!=='none'),allSelected=visible.length>0&&visible.every(c=>selectedMemoryIds.has(c.dataset.memoryId));visible.forEach(c=>{if(allSelected)selectedMemoryIds.delete(c.dataset.memoryId);else selectedMemoryIds.add(c.dataset.memoryId);let input=c.querySelector('.mem-check input');if(input)input.checked=!allSelected});updateBatchUI()}
    function updateBatchUI(){batchBar.classList.toggle('show',multiSelectMode);multiToggle.classList.toggle('active',multiSelectMode);multiToggle.textContent=multiSelectMode?'取消选择':'批量整理';selectedCount.textContent=selectedMemoryIds.size;batchDelete.disabled=selectedMemoryIds.size===0||batchDeleting}
    async function deleteSelectedMemories(){let ids=[...selectedMemoryIds];if(!ids.length||batchDeleting)return;if(!confirm('确定删除选中的 '+ids.length+' 条记忆？'))return;batchDeleting=true;updateBatchUI();let succeeded=[],failed=[];for(let i=0;i<ids.length;i+=8){let chunk=ids.slice(i,i+8),results=await Promise.allSettled(chunk.map(id=>{let memory=ALL_MEMS.find(m=>m.id===id);return memory?requestMemoryDelete(memory):Promise.reject(new Error('未找到记忆'))}));results.forEach((result,index)=>{if(result.status==='fulfilled')succeeded.push(chunk[index]);else failed.push(chunk[index])})}if(succeeded.length)applyDeletedMemories(succeeded);batchDeleting=false;failed.forEach(id=>selectedMemoryIds.add(id));updateBatchUI();showToast(failed.length?'已删除 '+succeeded.length+' 条，'+failed.length+' 条失败':'已删除 '+succeeded.length+' 条')}
    async function toggleResolved(id,resolved){let r=await fetch('/api/long-term-memories/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolved:!resolved})});if((await r.json()).success)location.reload()}
    async function triggerCleanup(){if(!confirm('让 AI 检查重复记忆并生成合并建议？建议可在收纳室查看，不会直接删除记忆。'))return;try{let r=await fetch('/api/memory-merge-reviews/scan?pwd='+encodeURIComponent(PWD),{method:'POST'}),d=await r.json();if(!r.ok||d.success===false)throw new Error(d.error||'暂时无法开始整理');showToast('已开始检查，可在收纳室查看建议')}catch(e){showToast(e.message)}}
    loadData();
  </script>
</body>
