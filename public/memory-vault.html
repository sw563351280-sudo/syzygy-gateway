<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>记忆库 · 溯星小屋</title>
<style>
:root{--bg:#e8eff7;--ink:#2a3850;--muted:#7890ad;--line:rgba(98,132,170,.18);--card:rgba(255,255,255,.48);--blue:#5f93cc;--aqua:#4ecbbd;--gold:#d7a744;--pink:#c38bb0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 78% 10%,rgba(255,255,255,.85),transparent 28%),linear-gradient(150deg,#edf5fc,#e2ebf5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{height:72px;padding:0 max(18px,calc((100vw - 820px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(235,243,251,.72);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.back{width:42px;height:42px;border:0;border-radius:14px;background:rgba(255,255,255,.58);box-shadow:8px 8px 18px rgba(116,143,172,.18),-5px -5px 14px rgba(255,255,255,.65);color:var(--blue);font-size:21px;text-decoration:none;display:grid;place-items:center}.top h1{font-size:20px;margin:0;letter-spacing:.03em}.top p{margin:2px 0 0;font-size:12px;color:var(--muted)}main{max-width:820px;margin:auto;padding:22px 16px 42px}.hero{padding:8px 2px 16px}.hero h2{font-size:28px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:14px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}.stat{padding:13px;border:1px solid var(--line);border-radius:17px;background:var(--card);box-shadow:7px 8px 18px rgba(107,132,158,.09)}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}section{margin:13px 0;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:10px 12px 24px rgba(104,127,153,.1)}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.head h3{margin:0;font-size:18px}.head p{margin:4px 0 0;font-size:12px;color:var(--muted)}button{font:inherit}.refresh,.resolve{border:0;border-radius:11px;padding:8px 11px;background:rgba(255,255,255,.62);color:var(--blue);cursor:pointer}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.chip{border:1px solid var(--line);border-radius:99px;padding:6px 11px;background:rgba(255,255,255,.4);color:var(--muted);white-space:nowrap;cursor:pointer}.chip.on{background:var(--blue);color:white;border-color:var(--blue)}.items{display:grid;gap:8px}.item{padding:12px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid rgba(98,132,170,.12)}.fact{font-size:14px;line-height:1.55}.meta{margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:11px}.tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.tag{padding:3px 7px;border-radius:99px;background:rgba(78,203,189,.12);color:#438d87}.quiet{border-left:3px solid rgba(95,147,204,.5)}.archived{opacity:.56}.notice{color:var(--muted);font-size:13px;padding:7px 0}.review{border-left:3px solid var(--gold)}.candidate{font-size:12px;color:var(--muted);padding:8px 0 0}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.resolve{font-size:12px;padding:6px 9px}.resolve.gold{color:#9b6d19}.resolve.pink{color:#a55d86}.digest{border-left:3px solid var(--aqua)}.more{margin-top:10px;width:100%;border:0;border-radius:11px;padding:8px 11px;background:rgba(255,255,255,.62);color:var(--blue);cursor:pointer}@media(max-width:480px){.hero h2{font-size:25px}.statrow{gap:7px}.stat{padding:11px}.stat b{font-size:19px}}
</style></head><body><header class="top"><a class="back" href="/" aria-label="返回">←</a><div><h1>记忆库</h1><p>碎屑、牵挂与尚未定论的事</p></div></header><main><div class="hero"><h2>先收好，再决定。</h2><p>星渡只放已经刻下来的长期记忆；这里收纳还在生长的生活。</p></div><div class="statrow"><div class="stat"><b id="crumbN">—</b><span>生活碎屑</span></div><div class="stat"><b id="careN">—</b><span>牵挂线</span></div><div class="stat"><b id="reviewN">—</b><span>待确认合并</span></div></div><section><div class="head"><div><h3>生活碎屑</h3><p>按标签收纳；quiet 后不主动打扰，但你提起相关事时仍会被找回。</p></div><button class="refresh" onclick="load()">↻</button></div><div id="crumbChips" class="chips"></div><div id="crumbs" class="items"><div class="notice">加载中…</div></div></section><section><div class="head"><div><h3>昨日留下的页角</h3><p>一天最多一张，不再由 Dream 重复总结。</p></div></div><div id="digests" class="items"><div class="notice">加载中…</div></div></section><section><div class="head"><div><h3>牵挂线</h3><p>不是任务，是过几天自然问一句的事。</p></div></div><div id="cares" class="items"><div class="notice">加载中…</div></div></section><section><div class="head"><div><h3>待确认合并</h3><p>相近，但不替你擅自决定。</p></div></div><div id="reviews" class="items"><div class="notice">加载中…</div></div></section></main><script>
const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'';let DATA={},tag='全部',showAllCrumbs=false;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>{try{return new Date(s).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};const shenRecord=s=>{s=String(s||'').trim();if(!s)return '';if(/^我(?:记着|得记|想起|留着|还惦记)/.test(s))return s;return '我记着：'+s.replace(/江鱼/g,'你').replace(/沈望/g,'我')};
async function load(){let r=await fetch('/api/longterm-page-data?pwd='+encodeURIComponent(PWD));if(!r.ok){document.body.innerHTML='<p style="padding:2rem">打不开收纳室，请从首页重新进入。</p>';return}DATA=await r.json();render()}
function item(c){let state=c.status==='quiet'?'quiet':c.status==='archived'?'archived':'',quote=c.source_quote?'<details class="origin"><summary>原话</summary><div>'+esc(c.source_quote)+'</div></details>':'';return '<div class="item '+state+'"><div class="fact">'+esc(shenRecord(c.fact))+'</div>'+quote+'<div class="meta"><span>'+time(c.happened_at||c.created_at)+' · '+(c.status==='quiet'?'静默':'活跃')+'</span><span class="tags">'+(c.entities||[]).slice(0,2).map(x=>'<i class="tag">'+esc(x)+'</i>').join('')+'</span></div></div>'}
function render(){let crumbs=DATA.crumbs||[],live=crumbs.filter(c=>c.status!=='archived'),freq={};live.forEach(c=>[...(c.entities||[]),...(c.tags||[])].forEach(t=>{t=String(t||'').trim();if(t.length>=2)freq[t]=(freq[t]||0)+1}));let allTags=Object.keys(freq).filter(t=>freq[t]>=3).sort((a,b)=>freq[b]-freq[a]||a.localeCompare(b,'zh-CN')).slice(0,10);if(tag!=='全部'&&!allTags.includes(tag))tag='全部';document.getElementById('crumbN').textContent=live.length;document.getElementById('careN').textContent=(DATA.anticipations||[]).filter(a=>a.status==='open').length;document.getElementById('reviewN').textContent=(DATA.mergeReviews||[]).length;document.getElementById('crumbChips').innerHTML=['全部',...allTags].map(t=>'<button class="chip '+(t===tag?'on':'')+'" onclick="tag='+JSON.stringify(t)+';showAllCrumbs=true;render()">'+esc(t)+(t==='全部'?'':' · '+freq[t])+'</button>').join('');let filtered=tag==='全部'?live:live.filter(c=>[...(c.entities||[]),...(c.tags||[])].includes(tag));let visible=showAllCrumbs?filtered:filtered.slice(0,6);document.getElementById('crumbs').innerHTML=(visible.length?visible.map(item).join(''):'<div class="notice">这个标签下还没有东西。</div>')+(filtered.length>6?'<button class="more" onclick="showAllCrumbs=!showAllCrumbs;render()">'+(showAllCrumbs?'收起来':'查看全部 '+filtered.length+' 条')+'</button>':'');let ds=DATA.crumbDigests||[];document.getElementById('digests').innerHTML=ds.length?ds.slice(0,7).map(d=>'<div class="item digest"><div class="fact">'+esc(shenRecord(d.summary||'这天没有留下生活碎屑。'))+'</div><div class="meta"><span>'+esc(d.date)+' · '+(d.source_count||0)+' 条碎屑</span></div></div>').join(''):'<div class="notice">还没有要折成一页的昨天。</div>';let cs=(DATA.anticipations||[]).filter(a=>a.status==='open');document.getElementById('cares').innerHTML=cs.length?cs.map(a=>'<div class="item"><div class="fact">'+esc(shenRecord(a.content))+'</div><div class="meta"><span>想起 '+esc(a.entity)+' · '+time(a.due_at)+' · 第'+((a.attempts||0)+1)+'次</span><button class="resolve" onclick="resolveCare(\''+esc(a.id)+'\')">已经好了</button></div></div>').join(''):'<div class="notice">暂时没有挂在心上的事。</div>';let rs=DATA.mergeReviews||[];document.getElementById('reviews').innerHTML=rs.length?rs.map(r=>'<div class="item review"><div class="fact">'+esc(shenRecord(r.incoming&&r.incoming.content))+'</div><div class="candidate">'+esc(r.decision_reason||'系统觉得它像已有记忆，但没替你决定。')+'</div><div class="actions"><button class="resolve gold" onclick="resolveReview(\''+esc(r.id)+'\',\'merge\',\''+esc(r.suggested_target_id||'')+'\')">按建议合并</button><button class="resolve pink" onclick="resolveReview(\''+esc(r.id)+'\',\'keep_separate\')">保留两条</button></div></div>').join(''):'<div class="notice">没有犹豫不决的记忆。</div>'}
async function resolveCare(id){await fetch('/api/anticipations/'+encodeURIComponent(id)+'/resolve',{method:'POST'});load()}async function resolveReview(id,action,target){let r=await fetch('/api/memory-merge-reviews/'+encodeURIComponent(id)+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,target_id:target||null})});if(!r.ok)alert('这次没处理成功');load()}load();
</script></body></html>
