<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>档案室 · 溯星小屋</title>
<style>
:root{
  --bg-primary:#171a1f;--bg-card:#24272c;--bg-hover:#2a2d33;--bg-input:#1e2126;
  --text-primary:#ece7dc;--text-secondary:#9e9789;--text-muted:#5e5a52;
  --accent-blue:rgba(99,127,190,.6);--accent-gold:#D4A853;--accent-purple:rgba(160,130,190,.6);
  --danger:#d95a4a;--border:rgba(255,255,255,.07);--shadow:rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#171a1f 0%,#111418 48%,#0c0f13 100%);
  color:var(--text-primary);min-height:100dvh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:28px 28px;
}

/* topbar */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:#181b20;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
.top-left{display:flex;align-items:center;gap:8px}
.top-back{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;text-decoration:none;transition:opacity .15s}
.top-back:active{opacity:.7}
.top-title{font-size:1.05rem;font-weight:600;color:var(--text-primary)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn-icon{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:opacity .15s}
.btn-icon:active{opacity:.7}
.btn-more{position:relative}
.more-menu{display:none;position:absolute;top:44px;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:180px;z-index:200;box-shadow:0 4px 16px var(--shadow)}
.more-menu.show{display:block}
.more-menu button{display:block;width:100%;padding:10px 14px;border:none;background:transparent;color:var(--text-primary);font-size:.85rem;text-align:left;border-radius:6px;cursor:pointer;font-family:inherit}
.more-menu button:hover{background:var(--bg-hover)}
.more-menu button.danger{color:var(--danger)}

/* main */
.main-content{position:relative;z-index:1;padding:72px 1rem 2rem;max-width:780px;margin:0 auto}

/* hero */
.archive-hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.archive-hero h1{font-size:1.4rem;font-weight:600;color:var(--text-primary);letter-spacing:.5px}
.archive-hero p{font-size:.78rem;color:var(--text-muted);margin-top:2px}
.archive-hero .btn-add{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--accent-gold);background:transparent;color:var(--accent-gold);cursor:pointer;font-size:.82rem;font-family:inherit;white-space:nowrap;transition:all .15s}
.archive-hero .btn-add:active{background:rgba(212,168,83,.1)}

/* tools */
.archive-tools{margin-bottom:16px}
.archive-tools .search-row{display:flex;gap:8px;margin-bottom:10px}
.archive-tools .search-row input{flex:1;padding:0 14px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);font-size:.85rem;font-family:inherit;outline:none}
.archive-tools .search-row input::placeholder{color:var(--text-muted)}
.archive-tools .search-row input:focus{border-color:rgba(99,127,190,.4)}
/* chips */
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--text-secondary);font-size:.76rem;white-space:nowrap;cursor:pointer;transition:all .15s;font-family:inherit}
.chip.active{background:var(--accent-gold);border-color:var(--accent-gold);color:#fff}

/* stats */
.archive-stats{display:flex;align-items:center;justify-content:space-between;font-size:.76rem;color:var(--text-muted);margin-bottom:8px;flex-wrap:wrap;gap:8px}
.archive-stats .stats-nums{display:flex;gap:10px}
.archive-stats .stats-nums b{color:var(--text-secondary)}
.archive-stats .sort-seg{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.archive-stats .sort-seg button{padding:5px 12px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:.72rem;font-family:inherit}
.archive-stats .sort-seg button.active{background:var(--bg-card);color:var(--text-secondary)}
.archive-stats .sort-seg button:first-child{border-right:1px solid var(--border)}

/* cards */
.mem-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;position:relative;border-left:3px solid transparent}
.mem-card.src-manual{border-left-color:rgba(212,160,74,.55)}
.mem-card.src-ai_active{border-left-color:rgba(99,127,190,.55)}
.mem-card.src-butler_summary{border-left-color:rgba(140,200,220,.55)}
.mem-card.src-archived,.mem-card.cat-archived{border-left-color:rgba(140,200,220,.55)}
.mem-card.src-roleplay{border-left-color:rgba(160,130,190,.55)}
.mem-card .mem-content{font-size:16px;line-height:1.72;color:#f0ece3;white-space:pre-wrap;word-break:break-word}
.mem-card .mem-content.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mem-card .mem-expand{display:block;margin-top:6px;font-size:.75rem;color:var(--text-muted);cursor:pointer;border:none;background:none;font-family:inherit;padding:0}
.mem-card .mem-expand:hover{color:var(--text-secondary)}
.mem-card .mem-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.mem-tag{background:rgba(255,255,255,.06);color:#9e9789;font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.05)}
.mem-card .mem-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.72rem;color:var(--text-muted)}
.mem-card .mem-actions{display:flex;gap:6px;align-items:center}
.mem-card .mem-actions button{font-size:.72rem;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .15s}
.mem-card .mem-actions button:hover{color:var(--text-secondary);border-color:rgba(255,255,255,.15)}
.mem-card .mem-actions .act-del{color:rgba(217,90,74,.5)}
.mem-card .mem-actions .act-del:hover{color:var(--danger)}.mem-check{position:absolute;top:10px;right:10px;z-index:2}
.mem-check input{width:18px;height:18px;accent-color:var(--accent-gold)}
.btn-del{color:var(--danger)!important}.btn-del:disabled{opacity:.4}

/* heat bar */
.heat-mini{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;color:var(--text-muted)}
.heat-bar{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;flex-shrink:0}
.heat-bar-fill{display:block;height:100%;width:0;border-radius:2px;transition:width .3s}
.heat-bar-fill.hot{background:linear-gradient(90deg,#d86b4a,#f0a05a)}.heat-bar-fill.warm{background:linear-gradient(90deg,#b99a5f,#d4b56f)}.heat-bar-fill.cool{background:linear-gradient(90deg,#5f789c,#86a6c8)}

/* empty */
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text-muted)}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem;opacity:.4}
.empty-text{font-size:.85rem}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg-card);border-radius:14px;padding:1.5rem;width:90%;max-width:420px;max-height:80vh;overflow-y:auto}
.modal-box h3{font-size:1rem;margin-bottom:1rem;color:var(--text-primary)}
.modal-box textarea,.modal-box input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);font-size:.85rem;font-family:inherit;margin-bottom:10px;resize:vertical}
.modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end}

.edit-area{display:none;margin-top:8px}
.edit-area textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);font-size:.85rem;font-family:inherit;margin-bottom:6px;resize:vertical;min-height:60px}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--text-secondary);padding:10px 24px;border-radius:8px;font-size:.85rem;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.btn-sm{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-size:.8rem;font-family:inherit;white-space:nowrap;transition:all .15s;min-height:44px;display:flex;align-items:center}
.btn-sm:active{opacity:.7}.btn-sm.accent{color:var(--accent-blue);border-color:var(--accent-blue)}
.btn-sm.gold{color:var(--accent-gold);border-color:var(--accent-gold)}

@media(min-width:768px){
  .main-content{padding:72px 2rem 3rem}
}
</style></head><body>

<div class="top-bar"><div class="top-left"><a class="top-back" href="/">←</a><span class="top-title">档案室</span></div><div class="top-actions"><button class="btn-icon" onclick="location.reload()" title="刷新">↻</button><div class="btn-more"><button class="btn-icon" onclick="this.nextElementSibling.classList.toggle('show')">···</button><div class="more-menu"><button onclick="triggerDream()">🌙 触发 Dream</button><button onclick="restoreAll()">🔓 全部恢复</button><button onclick="triggerCleanup()">🧹 AI清理</button><button id="multiMenuItem" onclick="toggleMultiSelect()">☑ 多选</button><button id="batchMenuItem" class="danger" onclick="deleteSelectedMemories()" style="display:none">🗑 删除选中 <span id="selectedCount">0</span></button></div></div></div></div>

<div class="main-content">

<section class="archive-hero">
  <div><h1>档案室</h1><p>长期记忆 · 冰封记录 · 手动写入</p></div>
  <button class="btn-add" onclick="openAddModal()">＋ 新增</button>
</section>

<section class="archive-tools">
  <div class="search-row">
    <input type="text" id="arSearch" placeholder="搜索长期记忆..." oninput="renderArchive()" style="width:100%">
  </div>
  <div class="filter-chips" id="filterChips"></div>
  <div class="archive-stats">
    <span class="stats-nums">共 <b id="arCount">0</b> 条 · 🔥 <b id="arHigh">0</b> · 🫧 <b id="arMid">0</b> · 🧊 <b id="arLow">0</b></span>
    <div class="sort-seg"><button onclick="sortByHeat()" id="segHeat">热度</button><button onclick="sortByTime()" id="segTime">时间</button></div>
  </div>
</section>

<div id="archiveList"><div class="empty-state"><div class="empty-icon">💎</div><div class="empty-text">加载中...</div></div></div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="addModal"><div class="modal-box">
<h3>💎 写入记忆</h3><textarea id="newContent" rows="3" placeholder="记忆内容..."></textarea>
<input type="text" id="newTags" placeholder="标签(逗号分隔)，打roleplay进游戏箱">
<div class="btn-row"><button class="btn-sm" onclick="closeAddModal()">取消</button><button class="btn-sm accent" onclick="submitNew()">💾 保存</button></div>
</div></div>

<script>
var PWD=new URLSearchParams(location.search).get('pwd')||'111111';
var AR_MEMS=[],AR_COUNTS={},AR_HEAT={},arCat='all';
var multiSelectMode=false;
var selectedMemoryIds=new Set();

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

/* ── load ── */
function showLoadError(msg){
  document.getElementById('archiveList').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">'+msg+'</div><button class="btn-sm" onclick="loadArchive()" style="margin-top:10px">🔄 重试</button></div>';
}
function showAuthError(){
  document.getElementById('archiveList').innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-text">密码不对，加载失败</div><button class="btn-sm" onclick="reenterPwd()" style="margin-top:10px">🔑 重新输入密码</button></div>';
}
function reenterPwd(){
  var p=prompt('管理密码:');
  if(!p)return;
  PWD=p;
  localStorage.setItem('memoryPwd',p);
  loadArchive();
}
async function loadArchive(){
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort()},12000);
  var r;
  try{
    r=await fetch('/api/longterm-page-data?pwd='+encodeURIComponent(PWD),{signal:ctrl.signal});
  }catch(e){
    clearTimeout(timer);
    showLoadError(e.name==='AbortError'?'请求超时，网络可能卡住了':'网络错误，加载失败');
    return;
  }
  clearTimeout(timer);
  if(!r.ok){
    if(r.status===401)showAuthError();else showLoadError('加载失败（'+r.status+'）');
    return;
  }
  var d;
  try{
    d=await r.json();
  }catch(e){
    showLoadError('返回数据解析失败');
    return;
  }
  AR_MEMS=d.memories||[];AR_COUNTS=d.counts||{};AR_HEAT=d.heatStats||{};
  document.getElementById('arCount').textContent=AR_MEMS.length;
  document.getElementById('arHigh').textContent=AR_HEAT.high||0;
  document.getElementById('arMid').textContent=AR_HEAT.mid||0;
  document.getElementById('arLow').textContent=AR_HEAT.low||0;
  renderChips();renderArchive();
}

/* ── chips ── */
function renderChips(){
  var chips=[{key:'all',label:'全部'},{key:'src:archived',label:'❄️ 冰封'},{key:'src:roleplay',label:'🎮 游戏库'},{key:'src:manual',label:'✍️ 手动'},{key:'src:ai_active',label:'🤖 AI'},{key:'src:butler_summary',label:'🌙 管家'}];
  document.getElementById('filterChips').innerHTML=chips.map(function(c){
    return '<span class="chip'+(arCat===c.key?' active':'')+'" onclick="setChip(\''+c.key+'\')">'+c.label+'</span>';
  }).join('');
}
function setChip(v){arCat=v;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});document.querySelectorAll('.chip').forEach(function(c){if(c.textContent===(v==='all'?'全部':v==='src:archived'?'❄️ 冰封':v==='src:roleplay'?'🎮 游戏库':v==='src:manual'?'✍️ 手动':v==='src:ai_active'?'🤖 AI':'🌙 管家'))c.classList.add('active')});renderArchive()}

/* ── src helpers ── */
function srcKey(m){return m.category==='archived'?'src-archived':m.source||''}
function srcLabel(s){return ({manual:'✍️ 手动',ai_active:'🤖 AI',butler_summary:'🌙 管家',roleplay:'🎮 RP'})[s]||s||'未知'}
function getTTLLabel(m){if(!m.expires_at)return'';var r=m.expires_at-Date.now();if(r<=0)return'⏰';return Math.ceil(r/86400000)+'d'}

/* ── render cards ── */
function renderArchive(){
  var kw=(document.getElementById('arSearch').value||'').toLowerCase();
  var mems=AR_MEMS;
  if(arCat==='src:archived') mems=mems.filter(function(m){return m.category==='archived'});
  else if(arCat==='src:roleplay') mems=mems.filter(function(m){return m.source==='roleplay'||(m.tags||[]).includes('roleplay')});
  else if(arCat==='src:manual') mems=mems.filter(function(m){return m.source==='manual'});
  else if(arCat==='src:ai_active') mems=mems.filter(function(m){return m.source==='ai_active'});
  else if(arCat==='src:butler_summary') mems=mems.filter(function(m){return m.source==='butler_summary'});
  if(kw)mems=mems.filter(function(m){return (m.content||'').toLowerCase().includes(kw)});
  var list=document.getElementById('archiveList');
  if(mems.length===0){list.innerHTML='<div class="empty-state"><div class="empty-icon">💎</div><div class="empty-text">暂无匹配记忆</div></div>';return}
  list.innerHTML=mems.map(function(m){
    var h=m.liveHeat!==undefined?m.liveHeat:(m.heat||.5);
    var hCls=h>.7?'hot':h>=.3?'warm':'cool';
    var heatBar='<span class="heat-mini"><span class="heat-bar"><span class="heat-bar-fill '+hCls+'" style="width:'+Math.round(h*100)+'%"></span></span>'+h.toFixed(2)+'</span>';
    var checked=selectedMemoryIds.has(m.id)?' checked':'';
    var selectBox=multiSelectMode?'<label class="mem-check"><input type="checkbox" '+checked+' onchange="toggleMemorySelected(\''+m.id+'\',this.checked)"></label>':'';
    var ttl=getTTLLabel(m);
    var tags=[];
    if(m.tags)for(var i=0;i<m.tags.length;i++)tags.push('<span class="mem-tag">'+m.tags[i].replace(/</g,'&lt;')+'</span>');
    var act=m.category==='archived'?'<button onclick="restoreMem(\''+m.id+'\')">解封</button><button class="act-del" onclick="delArchMem(\''+m.id+'\')">🗑</button>':'<button onclick="editMem(\''+m.id+'\')">✏️</button><button onclick="toggleResolved(\''+m.id+'\','+!!m.resolved+')">'+(m.resolved?'✓已解决':'○未解决')+'</button><button class="act-del" onclick="delMem(\''+m.id+'\')">🗑</button>';
    return '<div class="mem-card src-'+srcKey(m)+'" id="card-'+m.id+'">'
      +selectBox
      +((m.chunk_summary||m.summary)?'<div class="mem-summary" style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px;padding:2px 6px;background:rgba(255,255,255,.03);border-radius:4px;border-left:2px solid #b99a5f">📋 '+(m.chunk_summary||m.summary).replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>':'')
      +'<div class="mem-content clamped" id="ctitle-'+m.id+'">'+(m.content||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>'
      +'<button class="mem-expand" id="expand-'+m.id+'" onclick="toggleCardExpand(\''+m.id+'\')">展开 ▾</button>'
      +(tags.length||ttl?'<div class="mem-tags">'+tags.join('')+(ttl?'<span class="mem-tag">'+ttl+'</span>':'')+'</div>':'')
      +'<div class="mem-meta"><span>'+new Date(m.created_at).toLocaleString('zh-CN')+' · '+srcLabel(m.source)+' '+heatBar+'</span><div class="mem-actions">'+act+'</div></div>'
      +'<div class="edit-area" id="edit-'+m.id+'"><textarea id="ta-'+m.id+'">'+(m.content||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea><input id="tags-'+m.id+'" value="'+(m.tags||[]).join(',')+'" placeholder="标签,逗号分隔"><input id="heat-'+m.id+'" value="'+(m.heat||0.5)+'" placeholder="热度 0-1" style="width:80px"><input id="sum-'+m.id+'" value="'+(m.chunk_summary||'').replace(/"/g,'&quot;')+'" placeholder="摘要 (chunk_summary)"><div class="btn-row"><button class="btn-sm accent" onclick="saveEdit(\''+m.id+'\')">保存</button><button class="btn-sm" onclick="cancelEdit(\''+m.id+'\')">取消</button></div></div>'
      +'</div>';
  }).join('');
}

function toggleCardExpand(id){
  var ct=document.getElementById('ctitle-'+id);var btn=document.getElementById('expand-'+id);
  if(!ct||!btn)return;
  if(ct.classList.contains('clamped')){ct.classList.remove('clamped');btn.textContent='收起 ▴'}
  else{ct.classList.add('clamped');btn.textContent='展开 ▾'}
}

/* ── sort ── */
var _sortDir='heat';
function sortByHeat(){
  _sortDir='heat';document.getElementById('segHeat').classList.add('active');document.getElementById('segTime').classList.remove('active');
  AR_MEMS.sort(function(a,b){var ha=a.liveHeat!==undefined?a.liveHeat:(a.heat||.5);var hb=b.liveHeat!==undefined?b.liveHeat:(b.heat||.5);return hb-ha});
  renderArchive();
}
function sortByTime(){
  _sortDir='time';document.getElementById('segTime').classList.add('active');document.getElementById('segHeat').classList.remove('active');
  AR_MEMS.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at)});
  renderArchive();
}
document.getElementById('segHeat').classList.add('active');

/* ── edit ── */
function editMem(id){document.getElementById('ctitle-'+id).style.display='none';document.getElementById('expand-'+id).style.display='none';document.getElementById('edit-'+id).style.display='block'}
function cancelEdit(id){document.getElementById('ctitle-'+id).style.display='';document.getElementById('expand-'+id).style.display='';document.getElementById('edit-'+id).style.display='none'}
async function saveEdit(id){var c=document.getElementById('ta-'+id).value;var t=document.getElementById('tags-'+id).value.split(',').filter(Boolean);var h=parseFloat(document.getElementById('heat-'+id).value);var s=document.getElementById('sum-'+id).value;var body={content:c,tags:t};if(!isNaN(h))body.heat=h;if(s!==undefined)body.chunk_summary=s;await fetch('/api/long-term-memories/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});loadArchive()}

/* ── single ops ── */
async function delMem(id){if(confirm('删除这条记忆？')){await fetch('/api/long-term-memories/'+id,{method:'DELETE'});loadArchive()}}
async function restoreMem(id){await fetch('/api/archive-memories/'+id+'/restore',{method:'POST'});loadArchive()}
async function delArchMem(id){if(confirm('彻底删除这条冰封记忆？')){await fetch('/api/archive-memories/'+id,{method:'DELETE'});loadArchive()}}
async function toggleResolved(id,r){await fetch('/api/long-term-memories/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolved:!r})});loadArchive()}

/* ── multi-select ── */
function toggleMultiSelect(){
  multiSelectMode=!multiSelectMode;selectedMemoryIds.clear();updateBatchUI();renderArchive();
}
function toggleMemorySelected(id,checked){
  if(checked)selectedMemoryIds.add(id);else selectedMemoryIds.delete(id);updateBatchUI();
}
function updateBatchUI(){
  var count=selectedMemoryIds.size;
  var item=document.getElementById('batchMenuItem');var multiItem=document.getElementById('multiMenuItem');
  if(item){item.style.display=multiSelectMode?'block':'none';item.innerHTML='🗑 删除选中 <span id="selectedCount">'+count+'</span>'}
  if(multiItem)multiItem.textContent=multiSelectMode?'☑ 取消多选':'☑ 多选';
}
async function deleteSelectedMemories(){
  var ids=Array.from(selectedMemoryIds);if(ids.length===0)return;
  if(!confirm('确定删除选中的 '+ids.length+' 条记忆？'))return;
  var idSet=new Set(ids);
  var selectedMems=AR_MEMS.filter(function(m){return idSet.has(m.id)});
  var results=await Promise.allSettled(selectedMems.map(function(m){
    var url=m.category==='archived'?'/api/archive-memories/'+encodeURIComponent(m.id):'/api/long-term-memories/'+encodeURIComponent(m.id);
    return fetch(url,{method:'DELETE'}).then(async function(res){
      var data=await res.json().catch(function(){return{}});
      if(!res.ok||data.success===false)throw new Error(data.error||'删除失败');
      return data;
    });
  }));
  var failed=results.filter(function(r){return r.status==='rejected'});
  if(failed.length>0)toast('❌ 有 '+failed.length+' 条删除失败');else toast('✅ 已删除 '+ids.length+' 条');
  selectedMemoryIds.clear();updateBatchUI();loadArchive();
}

/* ── modal ── */
function openAddModal(){document.getElementById('addModal').classList.add('show')}
function closeAddModal(){document.getElementById('addModal').classList.remove('show')}
async function submitNew(){var c=document.getElementById('newContent').value;var t=document.getElementById('newTags').value.split(',').filter(Boolean);await fetch('/api/long-term-memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c,tags:t})});closeAddModal();loadArchive()}

/* ── dream / restore / cleanup ── */
async function triggerDream(){var p=prompt('管理员密码:');if(!p)return;var r=await fetch('/trigger-dream?pwd='+encodeURIComponent(p),{method:'POST'});toast((await r.json()).success?'✅ Dream已触发':'❌ 失败')}
async function restoreAll(){var p=prompt('管理员密码:');if(!p)return;var r=await fetch('/api/restore-all-messages?pwd='+encodeURIComponent(p),{method:'POST'});var d=await r.json();toast(d.success?'✅ 已恢复':'❌ '+d.error);if(d.success)location.reload()}
async function triggerCleanup(){
  var pwd=prompt('管理员密码:');if(!pwd)return;
  if(!confirm('确定让AI审查清理记忆库？这可能需要几十秒。'))return;
  toast('🧹 AI正在审查记忆库...');
  try{var r=await fetch('/trigger-cleanup?pwd='+encodeURIComponent(pwd),{method:'POST'});var d=await r.json();
    if(d.success){toast('✅ 清理完成: 删除'+d.deleted+'条, 合并'+d.merged+'组');setTimeout(function(){location.reload()},2000)}
    else toast('❌ '+(d.error||'失败'));
  }catch(e){toast('❌ 网络错误: '+e.message)}
}

/* ── init ── */
loadArchive();
</script></body></html>
