<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星渡 · 星尘</title><style>
:root{--ink:#28364d;--muted:#7890ad;--blue:#5f93cc;--line:rgba(98,132,170,.18);--card:rgba(255,255,255,.55)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 76% 9%,rgba(255,255,255,.86),transparent 27%),radial-gradient(circle at 13% 68%,rgba(183,214,239,.32),transparent 34%),linear-gradient(150deg,#edf5fc,#e2ebf5)}.top{height:72px;padding:0 max(16px,calc((100vw - 820px)/2));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(235,243,251,.76);backdrop-filter:blur(16px);position:sticky;top:0;z-index:4}.back{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.62);box-shadow:7px 7px 17px rgba(116,143,172,.17),-5px -5px 13px rgba(255,255,255,.7);color:var(--blue);font-size:21px;text-decoration:none}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.nav{margin-left:auto;display:flex;gap:5px}.nav a{padding:7px;color:var(--muted);font-size:12px;text-decoration:none}.nav .on{color:var(--blue);font-weight:600}main{max-width:820px;margin:auto;padding:22px 16px 42px}.hero{margin:3px 2px 18px}.hero h2{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:var(--muted);font-size:14px}.event-note{display:none;margin:-5px 0 14px;padding:11px 13px;border:1px solid rgba(215,167,68,.25);border-radius:13px;background:rgba(255,248,226,.62);color:#7b683d;font-size:12px;text-decoration:none}.event-note.show{display:block}.tools{display:flex;gap:8px;margin-bottom:18px}.tools select{flex:1;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:rgba(255,255,255,.55);color:var(--ink);font:inherit;outline:0}.count{display:grid;place-items:center;min-width:72px;border-radius:12px;background:rgba(95,147,204,.1);color:var(--blue);font-size:12px}.day{margin:20px 0 8px;display:flex;align-items:center;gap:8px;color:var(--blue);font-size:12px}.day:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(95,147,204,.25),transparent)}.crumb{position:relative;padding:13px 14px 12px 19px;margin-bottom:8px;border:1px solid rgba(255,255,255,.7);border-radius:15px;background:var(--card);box-shadow:5px 7px 15px rgba(104,127,153,.1)}.crumb:before{content:"";position:absolute;left:9px;top:20px;width:4px;height:4px;border-radius:50%;background:#6f9dc8;box-shadow:0 0 10px rgba(95,147,204,.5)}.fact{font-size:14px;line-height:1.65}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:11px}.tags{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:60px 15px;text-align:center;color:var(--muted)}@media(max-width:480px){main{padding:20px 12px 35px}.hero h2{font-size:24px}}
</style></head><body><header class="top"><a class="back" id="back" href="#">←</a><div class="brand"><h1>星尘</h1><p>尚未凝固的片段</p></div><nav class="nav"><a id="star" href="#">恒星</a><a class="on" href="#">星尘</a><a id="comet" href="#">彗星</a></nav></header><main><div class="hero"><h2>生活留下的微光</h2><p>碎屑不会抢占长期记忆的位置；需要时，它们仍能被重新找回。</p></div><a class="event-note" id="eventNote" href="#">有一条星尘已收到，正在等待重试。查看记忆收件箱 →</a><div class="tools"><select id="filter" onchange="render()"><option value="">全部星尘</option></select><div class="count" id="count">—</div></div><div id="list"><div class="empty">正在收集星尘…</div></div></main><script>
const PWD=new URLSearchParams(location.search).get('pwd')||localStorage.getItem('memoryPwd')||'',q='?pwd='+encodeURIComponent(PWD);back.href='/'+q;star.href='/long-term.html'+q;eventNote.href='/long-term.html'+q;comet.href='/comets.html'+q;let crumbs=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function day(s){let d=new Date(s);return Number.isNaN(d)?'未标日期':d.toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'short'})}function time(s){let d=new Date(s);return Number.isNaN(d)?'':d.toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'})}function render(){let key=filter.value,items=key?crumbs.filter(c=>[...(c.tags||[]),...(c.entities||[])].includes(key)):crumbs;count.textContent=items.length+' 条';let last='',html='';items.forEach(c=>{let d=day(c.happened_at||c.created_at);if(d!==last){html+='<div class="day">'+d+' <small></small></div>';last=d}html+='<article class="crumb"><div class="fact">'+esc(c.fact||'')+'</div><div class="meta"><span>'+time(c.happened_at||c.created_at)+(c.status==='quiet'?' · 静默':'')+'</span><span class="tags">'+[...(c.entities||[]),...(c.tags||[])].slice(0,3).map(t=>'#'+esc(t)).join('  ')+'</span></div></article>'});list.innerHTML=html||'<div class="empty">这个星座下还没有星尘。</div>'}async function load(){try{let r=await fetch('/api/longterm-page-data?pwd='+encodeURIComponent(PWD));if(!r.ok)throw 0;let d=await r.json();crumbs=(d.crumbs||[]).filter(c=>c.status!=='archived');let pendingCrumbs=(d.memoryEvents||[]).filter(e=>e.kind==='crumb');eventNote.classList.toggle('show',pendingCrumbs.length>0);eventNote.textContent=pendingCrumbs.length+' 条星尘已收到，正在等待整理。查看记忆收件箱 →';let n={};crumbs.forEach(c=>[...(c.tags||[]),...(c.entities||[])].forEach(t=>{if(t)n[t]=(n[t]||0)+1}));filter.innerHTML='<option value="">全部星尘</option>'+Object.keys(n).filter(t=>n[t]>=2).sort((a,b)=>n[b]-n[a]).slice(0,25).map(t=>'<option value="'+esc(t)+'">'+esc(t)+' · '+n[t]+'</option>').join('');render()}catch(e){list.innerHTML='<div class="empty">星尘暂时无法读取。</div>'}}load();
</script></body></html>
