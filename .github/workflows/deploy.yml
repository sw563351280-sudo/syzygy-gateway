name: Deploy to Contabo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o PasswordAuthentication=no -i ~/.ssh/deploy_key root@46.250.248.31 '
            set -e
            set -x  # 逐行打印命令，便于定位失败位置
            cd /opt/syzygy || exit 1

            # 备份沈望在VPS上修改的文件
            mkdir -p /tmp/syzygy_backup
            git diff --name-only | while read f; do
              if [ -f "$f" ]; then
                dir=$(dirname "$f")
                mkdir -p "/tmp/syzygy_backup/$dir"
                cp "$f" "/tmp/syzygy_backup/$f"
                echo "  💾 备份: $f"
              fi
            done

            # 部署最新代码
            git fetch origin main
            git reset --hard origin/main
            npm install --production

            # 恢复沈望的本地修改（跳过 server.js / model_prompts.json — 由 patch 保证最新）
            if [ -d /tmp/syzygy_backup ]; then
              find /tmp/syzygy_backup -type f | while read f; do
                rel=$(echo "$f" | sed "s|^/tmp/syzygy_backup/||")
                case "$rel" in
                  server.js|model_prompts.json)
                    echo "  ⏭️ 跳过: $rel (由 patch_inject.js 保证)" ;;
                  *)
                    cp "$f" "/opt/syzygy/$rel"
                    echo "  ✅ 恢复: $rel" ;;
                esac
              done
              rm -rf /tmp/syzygy_backup
            fi

            # 补录历史对话原文到 transcripts（idempotent，已有则跳过）
            node migrate_transcripts.js || echo "⚠️ 补录脚本失败，继续部署"

            # 将当前 transcript_buffer 归档到当月文件，防止未满6轮的消息丢失
            node archive_buffer.js || echo "⚠️ buffer 归档失败"

            # 从对话原文恢复可能被旧标签页覆盖的消息（已禁用：会在顶部插入重复旧消息）
            echo "⏭️ 跳过 restore_transcript_to_chat.js（已禁用）"

            # 诊断
            node diag_file.js

            # 清理重复消息 + 加 stable id
            node dedup_daily.js || echo "⚠️ 去重流程结束"
            node restore_recent.js || echo "⚠️ 恢复流程结束"

            # 清理重复消息 + 按时间排序
            node dedup_messages.js || echo "⚠️ 去重脚本失败"

            # 从 transcript 恢复最近20条消息（仅当会话被脏数据覆盖时）
            node restore_from_transcripts.js || echo "⚠️ transcript恢复失败"

            # === 强制补丁：确保 model_prompt 注入不被本地备份覆盖 ===
            # patch_inject.js 已禁用 — server.js/model_prompts.json 由 git 直接提供
            # node patch_inject.js || echo "⚠️ 补丁执行出错，但继续部署"

            # 注入 SITE_PASSWORD 和 SESSION_SECRET 到 systemd 环境变量（仅首次）
            if ! grep -q SITE_PASSWORD /etc/systemd/system/syzygy.service; then
              sed -i "/^Environment=/ s/$/ SITE_PASSWORD=\"563351280.1230\" SESSION_SECRET=\"57603c8408c58bfa73b1dfbbbe9c926a943481234035967587504f235983074f\"/" /etc/systemd/system/syzygy.service
              systemctl daemon-reload
            fi

            # Step 1: 确保 .sensor_token 有效（不管 systemd 里有没有）
            if [ ! -s /opt/syzygy/.sensor_token ]; then
              echo "🔍 [Deploy] 生成新的 .sensor_token..."
              node -e '\''console.log(require("crypto").randomBytes(32).toString("hex"))'\'' > /opt/syzygy/.sensor_token || { echo "❌ 生成token失败"; exit 1; }
              chmod 600 /opt/syzygy/.sensor_token
              echo "🔑 [Deploy] 已生成 .sensor_token"
            else
              echo "🔍 [Deploy] .sensor_token 已存在且非空，复用"
            fi
            TOKEN=$(cat /opt/syzygy/.sensor_token)
            echo "🔍 [Deploy] Token长度: ${#TOKEN} 字符"
            if [ ${#TOKEN} -lt 64 ]; then
              echo "⚠️ [Deploy] Token长度不足，重新生成..."
              node -e '\''console.log(require("crypto").randomBytes(32).toString("hex"))'\'' > /opt/syzygy/.sensor_token
              chmod 600 /opt/syzygy/.sensor_token
              TOKEN=$(cat /opt/syzygy/.sensor_token)
              echo "🔍 [Deploy] 新Token长度: ${#TOKEN} 字符"
            fi

            # Step 2: 确保 systemd 里有正确的 SENSOR_INGEST_TOKEN
            if grep -q 'SENSOR_INGEST_TOKEN=' /etc/systemd/system/syzygy.service; then
              echo "🔍 [Deploy] SENSOR_INGEST_TOKEN 已存在，更新为最新值..."
              sed -i "s/SENSOR_INGEST_TOKEN=\"[^\"]*\"/SENSOR_INGEST_TOKEN=\"${TOKEN}\"/" /etc/systemd/system/syzygy.service || { echo "❌ sed更新失败"; exit 1; }
            else
              echo "🔍 [Deploy] SENSOR_INGEST_TOKEN 未找到，追加..."
              sed -i "/^Environment=/ s/$/ SENSOR_INGEST_TOKEN=\"${TOKEN}\"/" /etc/systemd/system/syzygy.service || { echo "❌ sed追加失败"; exit 1; }
            fi
            systemctl daemon-reload || { echo "❌ daemon-reload失败"; exit 1; }
            echo "🔑 [Deploy] SENSOR_INGEST_TOKEN 已就绪"

            # === 确保 nginx client_max_body_size 足够大（图片上传不会 413） ===
            echo "🔍 [Deploy] 检查 nginx client_max_body_size..."
            NGINX_ENABLED=/etc/nginx/sites-enabled/syzygy
            if [ -L "$NGINX_ENABLED" ]; then
              NGINX_CONF=$(readlink -f "$NGINX_ENABLED")
            elif [ -f "$NGINX_ENABLED" ]; then
              NGINX_CONF="$NGINX_ENABLED"
            elif [ -f /etc/nginx/sites-available/syzygy ]; then
              NGINX_CONF=/etc/nginx/sites-available/syzygy
            else
              NGINX_CONF=""
            fi
            if [ -n "$NGINX_CONF" ] && [ -f "$NGINX_CONF" ]; then
              echo "🔍 [Deploy] nginx 配置: $NGINX_CONF"
              if grep -q client_max_body_size "$NGINX_CONF"; then
                echo "🔍 [Deploy] client_max_body_size 已存在: $(grep client_max_body_size "$NGINX_CONF" | head -1)"
              else
                echo "🔧 [Deploy] 添加 client_max_body_size 50m 到 $NGINX_CONF"
                sed -i "/^[[:space:]]*server[[:space:]]*{/a\    client_max_body_size 50m;" "$NGINX_CONF"
                if nginx -t; then
                  systemctl reload nginx && echo "✅ nginx client_max_body_size 50m 已生效"
                else
                  echo "❌ nginx -t 失败，请手动检查配置"
                fi
              fi
              echo "🔍 [Deploy] 验证: $(nginx -T 2>/dev/null | grep client_max_body_size | head -1 || echo 未找到)"
            else
              echo "⚠️ [Deploy] 找不到 nginx syzygy 配置文件，跳过"
            fi

            # === VPS 控制台自动配置 ===
            echo "🔧 [Deploy] 配置 VPS 控制台..."

            # 检测本地 SSH 端口
            LOCAL_SSH_PORT=$(grep -E "^Port " /etc/ssh/sshd_config 2>/dev/null | awk "{print \$2}")
            LOCAL_SSH_PORT=${LOCAL_SSH_PORT:-22}
            echo "🔍 [Deploy] 本地 SSH 端口: ${LOCAL_SSH_PORT}"

            # 生成专用密钥对（仅首次）
            if [ ! -f /opt/syzygy/console_key ]; then
              ssh-keygen -t ed25519 -f /opt/syzygy/console_key -N "" -C "syzygy-console" || { echo "❌ 生成控制台密钥失败"; exit 1; }
              chmod 600 /opt/syzygy/console_key
              echo "🔑 [Deploy] 已生成控制台密钥对"
            else
              echo "🔍 [Deploy] 控制台密钥已存在，跳过生成"
            fi

            # 授权公钥（仅首次）
            if ! grep -q "syzygy-console" /root/.ssh/authorized_keys 2>/dev/null; then
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              cat /opt/syzygy/console_key.pub >> /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/authorized_keys
              echo "🔓 [Deploy] 已授权控制台公钥"
            else
              echo "🔍 [Deploy] 控制台公钥已授权，跳过"
            fi

            # 获取主机指纹（优先读文件，不依赖网络）
            FINGERPRINT=""
            if [ -f /etc/ssh/ssh_host_ed25519_key.pub ]; then
              FINGERPRINT=$(cat /etc/ssh/ssh_host_ed25519_key.pub | awk "{print \$2}" | base64 -d | sha256sum | awk "{print \$1}")
            elif [ -f /etc/ssh/ssh_host_rsa_key.pub ]; then
              FINGERPRINT=$(cat /etc/ssh/ssh_host_rsa_key.pub | awk "{print \$2}" | base64 -d | sha256sum | awk "{print \$1}")
            fi
            if [ -z "$FINGERPRINT" ]; then
              echo "⚠️ [Deploy] 无法读取主机密钥文件，跳过控制台配置"
            else
              echo "🔍 [Deploy] 主机指纹: ${FINGERPRINT}"

              # 注入 VPS_CONSOLE_* 环境变量到 systemd
              if grep -q "VPS_CONSOLE_HOST=" /etc/systemd/system/syzygy.service; then
                echo "🔍 [Deploy] VPS_CONSOLE_* 已存在，更新指纹和端口..."
                sed -i "s/VPS_CONSOLE_HOST_FINGERPRINT=\"[^\"]*\"/VPS_CONSOLE_HOST_FINGERPRINT=\"${FINGERPRINT}\"/" /etc/systemd/system/syzygy.service
                sed -i "s/VPS_CONSOLE_PORT=\"[^\"]*\"/VPS_CONSOLE_PORT=\"${LOCAL_SSH_PORT}\"/" /etc/systemd/system/syzygy.service
              else
                echo "🔧 [Deploy] 追加 VPS_CONSOLE_* 环境变量..."
                sed -i "/^Environment=/ s/$/ VPS_CONSOLE_HOST=\"127.0.0.1\" VPS_CONSOLE_PORT=\"${LOCAL_SSH_PORT}\" VPS_CONSOLE_USERNAME=\"root\" VPS_CONSOLE_PRIVATE_KEY_PATH=\"\/opt\/syzygy\/console_key\" VPS_CONSOLE_HOST_FINGERPRINT=\"${FINGERPRINT}\" VPS_CONSOLE_LABEL=\"溯星 VPS\"/" /etc/systemd/system/syzygy.service
              fi
              systemctl daemon-reload
              echo "✅ [Deploy] VPS 控制台配置完成"
            fi

            echo "🔍 [Deploy] 重启服务..."
            (systemctl restart syzygy.service && sleep 2 && journalctl -u syzygy.service --no-pager -n 5) || echo "⚠️ restart may have failed"
            echo "=== DEPLOY OK ==="
            echo ""
            echo "🔑 SensorLogger令牌: $(cat /opt/syzygy/.sensor_token)"
            echo "   复制上面这行到 SensorLogger → HTTP Push → Authorization: Bearer <令牌>"
          '
