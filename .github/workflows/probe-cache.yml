name: Probe prompt cache (paid, max 3 calls)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-paid-cache-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded synthetic probe with server-held credential
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o PasswordAuthentication=no -i ~/.ssh/deploy_key root@46.250.248.31 'node - --paid-cache-probe' < scripts/cache-live-probe.js
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
